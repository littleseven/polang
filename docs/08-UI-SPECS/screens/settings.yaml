# ============================================================================
# 设置屏完整产品规格书（Settings Screen Spec）
# ============================================================================
# 基准端：Android SettingsScreen.kt (2103行，2026-10-02 口径) + SettingsBaseComponents.kt +
#        SettingsAiAgent.kt + SettingsServerAuth.kt + DataPrivacyScreen.kt + ReportIssueEntry.kt
# 用途：iOS 重做的唯一输入，不读 Android 源码
# 范围：iOS 当前阶段可实现的设置项（Android 专属项如 MIUI/电池优化/无障碍 标为 not_applicable）
# 2026-10-02 追齐批：主菜单补 report_issue 行；§3 重构为 remote_model/local_model/sandbox
# 三页现行 spec（旧 ai_agent 聚合页拆分）；developer 页五行常显 + TAG OpenCL 组 +
# 日志管理行式弹层；data_privacy 补备份恢复/清访客操作行。

# ============================================================================
# 1. 总体结构
# ============================================================================
root:
  type: navigation_stack
  background: "systemGroupedBackground"
  main_menu:
    layout: scrollable_column
    padding: { horizontal: 10, vertical: 6 }

# ============================================================================
# 2. 主菜单（SettingsMainMenu）
# ============================================================================
main_menu:
  # ① 账号英雄卡片（顶部全宽置顶行，反映登录态）
  account_hero_card:
    type: card
    shape: { corner_radius: 16 }
    background: "surfaceContainerHighest"
    padding: 16
    content:
      avatar:
        size: 48
        # 头像跟随人物页「这是我」标记：有封面时显示本人人脸（faceAware 裁剪防砍头），
        # 未标记/无封面/封面已删时回退默认 person 图标（PersonRepository.observeSelfAvatar）
        fallback: { icon: person, background: "primaryContainer", tint: "onPrimaryContainer" }
        badge:                                    # 2026-08-26 新增：右下相机角标
          icon: { material: photo_camera, sf: "camera.fill" }
          align: bottom_end
          click: "avatar_capture(target=Self, origin=SETTINGS_PAGE) → navigate(Screen.Camera)"  # 拍「我」头像并设封面，详见 dedup 设计规范 §11.2
      info:
        logged_in:
          email_font: { size: 16, weight: medium }   # titleMedium
          quota_text: "$used / $limit"                # bodySmall, onSurfaceVariant
        not_logged_in:
          title: "Account"                             # 账号
          desc: "Sign in for more quota and features"  # 注册账号享受更多额度与功能
      click: navigate_account

  # ②~⑤ 列表式分组（SettingsListSection + SettingsListRow）
  # 2026-08-26 设计稿 settings/main_list 落地：替代原「主题/语言快选卡 + 2 列分类卡片网格」，
  # 行 = 圆形彩色图标块 + 标题 + 可选右值（当前选中），组间分隔线 SettingsListDivider。
  list_sections:
    - id: personalization                          # 个性化
      rows:
        - { id: theme,    icon: dark_mode, icon_block: vibrantOrange, title: "Theme Mode", value: current_selection, click: theme_choice_dialog }     # 主题模式 theme_mode：弹层单选 system/light/dark
        - { id: language, icon: language,  icon_block: vibrantBlue,   title: "Language", value: current_selection, click: language_choice_dialog }  # 语言：弹层单选 system/English/中文/繁體中文/Español/Français
    - id: features                                 # 功能
      rows:
        - { id: people,          icon: account_circle, icon_block: vibrantGreen,     title: "People",          target: people }
        - { id: ai_memory,       icon: psychology,     icon_block: primaryContainer, title: "AI Memory",       target: memory_facts }
        # 相册扫描：原 Gallery 行 2026-08-26 更名（gallery_settings key，与 TagControl 页标题同源）
        - { id: gallery_scan,    icon: photo_library,  icon_block: vibrantOrange,    title: "Gallery Scan",    target: gallery }
        # 相册整理（去重 2.0）一级入口：2026-08-26 新增，切主页面 Pager 页 1（dedup 设计规范 §11.1）
        - { id: gallery_cleanup, icon: burst_mode,     icon_block: vibrantPurple,    title: "Gallery Cleanup", target: gallery_cleanup }
        - { id: camera,          icon: camera_alt,     icon_block: vibrantPink,      title: "Camera",          target: camera }
    - id: ai_system                                # AI 与系统
      rows:
        - { id: model_center,  icon: cloud_download, icon_block: vibrantGreen,     title: "Model Center",           target: model_center }
        - { id: remote_models, icon: cloud,          icon_block: status_info,      title: "Remote Models",          target: remote_models }   # 原 API Models 卡
        - { id: local_models,  icon: memory,         icon_block: vibrantPink,      title: "Local Models",           target: local_models }
        - { id: channels,      icon: forum,          icon_block: vibrantOrange,    title: "Communication Channel",  target: channels }
        - { id: sandbox,       icon: verified_user,  icon_block: primaryContainer, title: "Sandbox & Permissions",  target: sandbox }
    - id: others                                   # 其他
      rows:
        - { id: data_privacy, icon: privacy_tip, icon_block: vibrantBlue,  title: "Data & privacy",     target: data_privacy }
        # 上报问题（2026-09-26 自 Chat 顶栏迁入，ReportIssueEntry 自包含：行+对话框+提交；行题=对话框题=report_issue_title）
        - { id: report_issue, icon: bug_report,  icon_block: vibrantPink,  title: "Report a problem",  click: report_issue_dialog }
        - { id: developer,    icon: terminal,    icon_block: warningAmber, title: "Developer Options",  target: developer, visible_when: developer_options_unlocked }

  report_issue_dialog:                            # 对话框（AlertDialog 等价物）
    fields:
      category: { type: chips, options: [crash, bug, ai, other], default: other, keys: "report_issue_category_*" }
      title:    { type: text_field, single_line: true, required: true, key: report_issue_title_label }
      description: { type: text_field, lines: "3-6", key: report_issue_description_label }
    guest_rule: "未登录（serverToken 空）→ 顶部错误文案 report_issue_guest_not_allowed + 输入禁用，提交按钮置灰；title 空白时提交按钮也置灰"
    submit: "IssueReportClient.submit(token, category, title, description) = POST {baseUrl}/v1/report-issue（baseUrl=https://api.polang.net），header X-App-Token=token + X-Platform=ios，body {category,title,description}；成功 resp.issueId → toast report_issue_success(issueId) 并关窗；失败 resp.error → toast report_issue_error；提交中按钮文案 report_issue_submit + …且禁用取消"
    ios_note: "iOS 用 URLSession 实现等价 client（超时 connect 15s/read 30s）；无后端凭证时整行仍渲染但提交被 guest_rule 拦截"

  # ⑥ 版本页脚（原 About 卡收敛为页脚）
  version_footer:
    text: version_info
    hidden_interaction: "连点 7 次解锁开发者选项"

# ============================================================================
# 3. 远程模型分类页（remote_model，2026-10-02 重构：旧 ai_agent 聚合页拆分）
# ============================================================================
# Android 现状（SettingsScreen.kt:535-552）：RemoteModelsListSection + 助手性格区。
# 旧 ai_agent 聚合页已拆：语音组 → sandbox 页组3；静默回收 → sandbox 页组2；
# auto_execute_plans → sandbox 页组1；persona 留本页。
remote_model:
  sections:
    - remote_models_list:                    # RemoteModelsListSection（行式，无组标题）
        row:                                 # RemoteModelRow
          height: listRowHeight
          badge:                             # 供应商字母徽章（品牌色）
            size: listIconBlockSize
            corner: "圆角方块"
            letter: "白色首字母"
            colors: "deepseek→vibrantBlue / moonshot|kimi→#4F378B / openai→vibrantGreen / anthropic→#D97757 / 其他→#938F99"
          text: "双行：行1 = 模型名 + 可选「使用中」胶囊（selected 时，primary 底 onPrimary 小胶囊）；行2 = 供应商·已配置（onSurfaceVariant 12sp）"
          trailing: "⋯ 图标 → 动作弹层"
          tap: "设为当前模型（onSelectedModelChange(uniqueKey)）"
        data: "shared RemoteModelConfigs.fromJson(configsJson)，filter isConfigured；SSOT RemoteModelConfig.PROVIDERS"
        action_sheet:                        # ⋯ → SettingsOptionSheetShell（标题=模型名，副题=供应商 displayName）
          options:
            - { label: remote_model_set_current, selected_when: "uniqueKey == selectedModelId" }
            - { label: delete, behavior: "removeConfig；删的是当前选中项则自动改选下一个 isConfigured" }
        add_row:                             # 组尾「添加模型」行（有配置项时上方有分隔线）
          icon: "白色 + 于 vibrantGreen 圆形块"
          title: add_model
          target: add_remote_provider
    - assistant_persona:                     # 助手性格（SettingsSection 带组标题）
        type: option_chips                   # 单选 chips（FlowLayout capsule），maxLines=2
        title: "Assistant Personality"
        options: [default, warm_caring, lively_playful, crisp_direct]   # 展示序；持久化值 = shared AssistantPersona 枚举名 DEFAULT/WARM/LIVELY/CONCISE（SSOT shared/.../config/AssistantPersona.kt，ChatViewModel 按此消费）
        option_labels: "assistant_persona_default/warm/lively/concise + _desc（labels+描述键）"
        default: default
        persistence:
          android: "DataStore assistant_persona (enum name)"
          ios: "@AppStorage(\"assistant_persona\")（已存在，ChatViewModel:343 消费）"
        effect: "chat system prompt 尾段注入性格段（五语按界面语言选段），下一条消息生效；default 不注入"
        desc_per_option: true
        ios_note: "⚠️ 2026-10-02 前 iOS UI 不可达（孤儿 AiAgentSettingsView）而 ChatViewModel 已消费（恒 default）——本批次落地页面即接通"

# ============================================================================
# 3b. 本地模型分类页（local_model，2026-10-02 补 spec；Android :554-704）
# ============================================================================
local_model:
  sections:
    - id: detection_models                   # 组1 检测模型
      rows:
        - { id: roi,      icon: face,                icon_block: vibrantBlue,   title: stage_roi_title,      value: "当前模型名", click: roi_stage_dialog }
        - { id: landmark, icon: center_focus_strong, icon_block: vibrantPink,   title: stage_landmark_title,  value: "当前模型名", click: landmark_stage_dialog }
        - { id: tagger,   icon: sell,                icon_block: vibrantOrange, title: tagging_model_label,   value: "auto→tag_model_auto / 否则模型名", click: tagger_choice_dialog }
    - id: detection_strategy                 # 组2 检测策略
      rows:
        - { id: landmark_mode, type: switch, icon: speed, icon_block: vibrantBlue, title: face_landmark_mode }
        - { id: adaptive_interval, type: switch, icon: timer, icon_block: vibrantBlue, title: adaptive_face_detect_interval }
        - { id: interval_profile, icon: tune, icon_block: vibrantBlue, title: face_detect_profile_title, value: "当前档位", click: profile_choice_dialog, visible_when: "adaptive_interval == on" }
    - id: voice                              # 组3 语音（VoiceModelRow）
      rows:
        - { id: asr, icon: graphic_eq, icon_block: vibrantGreen, title: local_asr_model, value: "当前模型名", behavior: "已下载模型单选；无模型 → 跳模型中心 Audio 分类" }
        - { id: kws, icon: mic,        icon_block: vibrantGreen, title: local_kws_model, value: "当前模型名", behavior: "同 asr" }
  dialogs:
    stage_config_dialog:                     # ROI/关键点共用（StageConfigDialog）
      content: "模型单选（未下载项点选即触发下载，带下载态）+ 设备偏好双单选（CPU/GPU 等）"
      ios_note: "iOS 检测管线固定（MNN CPU 单管线，settings.yaml 既有台账）→ 设备偏好组 iOS 省略；模型单选仅保留 iOS 实有模型项，无等价项整行灰显注 Android only"
    tagger_choice_dialog: { type: single_choice, options: [tag_model_auto, Florence-2, Qwen3-VL] }
    profile_choice_dialog: { type: single_choice, options: [face_detect_profile_conservative, face_detect_profile_balanced, face_detect_profile_aggressive] }
  ios_note: "iOS 无双检测模型可选/无语音引擎（设-3 已登记）→ 组1 行 value 显示当前固定管线、弹层仅单选项或行灰显；组3 整组灰显注「后续版本」。结构（三组行式）必须先对齐，能力缺口用灰显/N-A 注记"

# ============================================================================
# 3e. 沙盒与权限分类页（sandbox，2026-10-02 补 spec；Android :710-873）
# ============================================================================
sandbox:
  sections:
    - id: agent_execution                    # 组1 智能体执行
      rows:
        - { id: auto_execute_plans, type: switch, icon: psychology, icon_block: vibrantPurple, title: ai_agent_auto_execute_plans, default: true }
        - { id: js_engine,          type: switch, icon: code,       icon_block: vibrantPurple, title: js_engine_execution, default: true }
    - id: device_access                      # 组2 设备访问
      rows:
        - { id: agent_camera,  type: switch, icon: camera_alt,     icon_block: vibrantBlue, title: agent_camera_access }
        - { id: camera_system, icon: lock, icon_block: vibrantBlue, title: camera_permission_system, value: permission_system_value, behavior: "跳系统设置 App 页（iOS openSettingsURLString）" }
        - { id: agent_gallery, type: switch, icon: photo_library,  icon_block: vibrantBlue, title: agent_gallery_access }
        - { id: gallery_system, icon: lock, icon_block: vibrantBlue, title: gallery_permission_system, value: permission_system_value, behavior: "同上" }
        - id: silent_trash                   # 「删除不再询问」API 31+（MANAGE_MEDIA）
          type: switch
          icon: delete_sweep
          icon_block: vibrantBlue
          title: settings_silent_trash_title
          summary: { granted: settings_silent_trash_summary_granted, denied: settings_silent_trash_summary_denied }
          behavior: "开+持权 → 静默回收（失败回落 token 通路）；未授权开启引导跳系统授权页；权限态 ON_RESUME 刷新"
          ios: not_applicable                # iOS 系统强制删除确认，无静默等价（gallery-grid.yaml §16b/§26 台账）→ iOS 整行省略
    - id: voice                              # 组3 语音
      rows:
        - { id: voice_mode, icon: mic, icon_block: vibrantGreen, title: voice_control, value: "当前模式", click: voice_mode_dialog }
        - { id: voice_entry, type: switch, icon: keyboard_voice, icon_block: vibrantGreen, title: voice_entry_enabled, default: false }
        - { id: ai_chat_entry, type: switch, icon: smart_toy, icon_block: vibrantGreen, title: ai_chat_entry_enabled, default: false }
  dialogs:
    voice_mode_dialog: { type: single_choice, options: [voice_command_mode_disabled, voice_command_mode_push_to_talk, voice_command_mode_wake_word], default: disabled }
  ios_note: "iOS 无语音引擎（设-3 登记）→ 组3 整组灰显注「后续版本」；voice_mode 行不弹层"

# ============================================================================
# 3f. 通信通道分类页（channels，2026-10-02 补 spec；Android CommunicationChannelScreen.kt 全文件）
# ============================================================================
channels:
  navigation_title: "Communication Channel"   # communication_channel（非 Channels）
  sections:
    - id: channel_selection                  # 组1 通道选择（channel_selection）
      type: option_chips                   # 单选 chips：feishu / telegram / none（不启用）
      persistence: "channel_type（feishu/telegram/none）"
      status_row:                          # chips 下方状态行（bodySmall onSurfaceVariant）
        rules: "凭据不齐 → channel_status_not_configured；已连接 → channel_status_connected；否则 → channel_status_disconnected"
        note: "isConnected 为激活驱动快照；isConfigured = 当前选中通道凭据齐全（飞书 appId+secret / TG token+chatId）"
    - id: feishu                             # 组2 飞书（双常驻段之一：不随选中显隐）
      title: channel_feishu
      desc: feishu_channel_desc
      fields:
        - { id: feishu_app_id, type: text_input, key: feishu_app_id, placeholder: feishu_app_id_placeholder }
        - { id: feishu_app_secret, type: text_input, key: feishu_app_secret, placeholder: feishu_app_secret_placeholder, password: true }
    - id: telegram                           # 组3 Telegram（双常驻段之一）
      title: channel_telegram
      desc: telegram_channel_desc
      fields:
        - { id: telegram_bot_token, type: text_input, key: telegram_bot_token, placeholder: telegram_bot_token_placeholder, password: true }
        - { id: telegram_chat_id, type: text_input, key: telegram_chat_id, placeholder: telegram_chat_id_placeholder }
      footnotes:
        - { key: telegram_bot_token_desc, style: "bodySmall onSurfaceVariant 0.7" }
        - { key: telegram_chat_id_desc, style: "bodySmall onSurfaceVariant 0.7" }
        - { key: telegram_security_note, style: "bodySmall error" }
  ios_note: "iOS 现状（S3d 前）：段随 channel_type 条件显隐、无状态行、标题 Channels——均按本 spec 对齐；isConnected 快照 iOS 若无激活驱动则以 isConfigured 二态退化（not_configured/disconnected），登记台账"

# ============================================================================
# 3c. 添加远程模型页（add_remote_provider，2026-08-21 新增：弹窗改页面）
#     路由 settings/add_remote_provider（精确路由，优先于 settings/{category}）
# ============================================================================
add_remote_provider:
  top_bar:
    title: "Add Remote Model"          # 添加远程模型（add_remote_model_title）
    back: true
  sections:
    - connected_providers:             # 「已接入」（provider_section_connected）
        label_font: { size: 13, color: "onSurfaceVariant" }
        source: "shared RemoteModelConfig.PROVIDERS（SSOT，双端共享，filter isVisible）"
        card_style:
          background: "surfaceContainerHighest"
          shape: { corner_radius: 12 }
        divider: { inset_start: 56 }
        row:
          height: 64
          badge:                       # 品牌色圆角字母徽章
            size: 28
            corner_radius: 8
            letter: "白色 SemiBold；Kimi=M(Moonshot)、TokenHub=T，其余取名称首字母"
            colors: { openai: "#000000", anthropic: "#D97757", deepseek: "#4D6BFE", kimi: "#4F378B", tencent: "#0052D9" }
          title: { font: { size: 15, weight: semibold } }        # displayName
          subtitle: { font: { size: 12 }, color: "onSurfaceVariant" }  # 「GPT-5 · GPT-4.1 等 4 个预置模型」动态生成
          trailing:
            configured_tag:            # 该 providerId 已有 isConfigured 模型时显示
              text: "Configured"       # remote_model_configured
              font: { size: 11 }
              color: "#0B9E4A"
              background: "#0B9E4A @ 12%"
            chevron: true
          click: "→ provider_config/{providerId}"
    - more_providers:                  # 「更多供应商」（provider_section_more）
        label_font: { size: 13, color: "onSurfaceVariant" }
        note: "静态列表，不可点击、无 chevron，右侧灰色「即将支持」胶囊"
        rows:
          - { name: "Google Gemini", subtitle: "Gemini 2.5 Pro · Flash", badge: "G 渐变蓝紫" }
          - { name: "通义千问", subtitle: "Qwen3 Max · Qwen Plus", badge: "Q #7147E8" }
          - { name: "智谱 AI", subtitle: "GLM-5 · GLM-4.6 系列", badge: "Z #3B5BFD" }
          - { name: "xAI", subtitle: "Grok 4 · Grok Code", badge: "X #202124" }
          - { name: "Mistral AI", subtitle: "Mistral Large · Codestral", badge: "M #FF7000" }
          - { name: "OpenRouter", subtitle: "200+ 模型聚合 · OpenAI 兼容", badge: "OR 9sp #6566F1" }
    - custom_provider:                 # 底部独立卡片（custom_provider_name）
        badge: "+ #00E676（vibrantGreen）"
        subtitle: "OpenAI 兼容协议 · 自定义 Base URL"
        chevron: true
        click: "→ provider_config/custom"

# ============================================================================
# 3d. 供应商配置页（provider_config/{providerId}，2026-08-21 新增）
#     providerId=custom 时为自定义供应商形态（额外 Base URL、无预置模型列表）
# ============================================================================
provider_config:
  top_bar:
    title: "$provider.displayName"     # 自定义形态显示「自定义供应商」
    back: true
  summary_card:                        # 供应商摘要卡
    badge: "同 add_remote_provider 徽章规则"
    title: { font: { size: 15, weight: semibold } }
    subtitle: "官方服务 · OpenAI 协议 / Anthropic 协议（按 protocol 字段）；自定义形态为「自定义供应商 · OpenAI 兼容协议」"
  api_key_section:
    label: "API Key"
    card_fields:
      - base_url:                      # 仅自定义供应商形态
          placeholder: "https://api.example.com/v1/"
      - api_key:
          style: "内凹浅色底（surfaceVariant 60%）、圆角 10、无指示线、密码掩码"
          privacy_hint: "API Key 仅保存在本机，不会上传到我们的服务器"
      - console_link:                  # 仅 provider.apiKeyUrl 非空时显示（RemoteModelProvider.apiKeyUrl）
          text: "前往 XX 控制台获取 →"
          color: "vibrantBlue"
          action: "系统浏览器打开 apiKeyUrl"
  model_section:
    label: "选择模型"
    preset_models:                     # 单选列表（仅预置供应商）
      row: { title: "$modelId", desc: "官方预置模型", trailing: "选中项右侧 vibrantBlue ✓" }
    custom_model_id_row:               # 末尾「自定义模型 ID」行，chevron 展开内联输入框
      subtitle: "填写任意模型名称，如 gpt-5-pro"
      note: "展开时覆盖预置单选（语义同原对话框）；自定义供应商形态只有此输入框"
  primary_button:
    text: "添加模型"                   # add_model
    style: "全宽 48 高，圆角 12，vibrantBlue 底白字"
    enabled_when: "API Key 非空且已选模型（或已填自定义模型 ID）；自定义形态另需 Base URL 非空"
    on_save: "RemoteModelConfigs.addConfig upsert → toJson 回写 UserPreferences（与 AddProviderModelDialog 同路径）→ 弹回远程模型列表页"

# ============================================================================
# 4. 账号分类页（account）
# ============================================================================
account:
  logged_in:
    header:
      avatar: { icon: person, size: 56, background: "primaryContainer" }
      email_font: { size: 16, weight: medium }
      subtitle: "Server Account"
    quota_card:
      shape: { corner_radius: 16 }
      background: "surfaceContainerLow"
      content:
        title: "Quota"
        value: "$used / $limit"
        value_color: "primary (or error if ≥90%)"
        progress_bar: { height: 8, color: "primary" }
        remaining_text: "$remaining inferences remaining"
    actions:
      - { type: filled_tonal, icon: refresh, text: "Refresh" }
      - { type: outlined, icon: logout, text: "Logout" }
    danger_zone:
      - { icon: delete_sweep, text: "Clear Guest Data", color: error }
      - { icon: delete, text: "Delete Account", color: error, confirm: true }

  not_logged_in:
    registration_form:
      title: "Register"
      desc: "Create an account for more quota"
      fields:
        email: { type: text, placeholder: "Email" }
        verification_code: { type: text, placeholder: "Verification Code" }
      buttons:
        - { text: "Send Code", action: send_verification }
        - { text: "Register / Login", action: verify_code }

