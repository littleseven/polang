# ============================================================================
# 9. 允许的平台差异
# ============================================================================
allowed_differences:
  - "卡片材质（Material elevation vs SwiftUI background）"
  - "Switch 控件原生外观"
  - "导航转场动画"
  - "开发者选项入口：Android 连点 7 次解锁门控，iOS 直接显示（2026-08-15 用户定）"
  - "开发者选项 Shader Debug Mode 双端 persistence-only（Android CameraScreen 硬编码 0；iOS Metal shader 无 uDebugMode 分支），chips 仅持久化不消费"
  - "开发者选项部分开发工具 iOS 灰显标注 Android only（Search Test/JSBridge/Accessibility 无对应页）"
  - "诊断日志：Android 存 Room 三表 + 同 traceId 横滑 pager；iOS 存 JSONL 文件 + 单条详情（pager 台账登记）"
  - "Log Modules 门控范围：双端均只门控 shared/平台 Logger 通道；iOS Swift 侧 print 不经门控"
  - "语音控制（iOS 暂无 sherpa-onnx；2026-08-19 起 Android 全部语音入口默认关闭，iOS Chat 语音占位按钮同步移除，voice 三组开关为 Android only 平台差异）"
  - "相册 TAG 控制页（iOS Phase 6.1 未落地）"

  # ── 2026-10-02 设置域追齐批（S3a~S3d）登记 ──
  - "上报问题：iOS IssueReportClient 超时以 request 级 30s 近似（URLSession 无独立 connect 15s API）；提交反馈为页内临时 overlay 胶囊（项目无共享 toast 构件）；表单弹层取 sheet（Android AlertDialog）"
  - "单选弹层形态：主题/语言/检测引擎/打标模型/间隔档位/模型动作统一取 confirmationDialog（Android AlertDialog 单选/动作弹层的平台原生等价）"
  - "版本页脚：version_info 键未入 iOS 文案源，页脚维持 iOS 既有 PoLang v{version} 格式"
  - "远程模型列表空态：复用 iOS 既有键（Default remote model has time limits / Add your own model…），与 Android remote_model_default_limit_title/desc 语义同措辞异"
  - "远程模型「In use」判定为 modelId 粒度（selected_model_id 存裸 modelId，既有存储语义）；跨供应商同名模型会同显，uniqueKey 粒度改造待评估"
  - "远程模型徽章色板：列表页（§3 remote_model）与添加页（§3c）同供应商品牌色定义不同（deepseek/openai），spec 级差异待统一"
  - "本地模型页组题 Detection Models/Detection Strategy 无 Android 文案键，iOS 五语为编译值，建议 Android 补键后回灌；模型专名（RetinaFace/MNN 2d106/MediaPipe 468pt/Florence-2）为同文展示键"
  - "检测策略开关（face_landmark_mode/adaptive_face_detection_interval/face_detect_interval_profile）与打标选择（tagger_model_key）iOS persistence-only（检测链路无消费端），行下脚注注明；js_engine_enabled 默认值对齐 spec true"
  - "沙盒页系统权限态用彩色状态点（绿/琥珀/红/灰）+ 跳系统设置行，无 Android 授权态五语文字键；voice_command_mode 不再由 iOS 设置页持有"
  - "通信通道：iOS 无 IM 激活连接驱动，状态行二态退化（not_configured/disconnected，connected 不可达），接通通道引擎后补三态"
  - "开发者页：TAG Generation Engine 组（tag_gen_use_opencl）iOS 整组省略（无 OpenCL 概念）；账号页 quota 剩余文案采用 auth_quota_remaining 键（spec 字面量无键）；部分账号/开发者文案 iOS 取 spec 字面量与 Android 键值仅 en 大小写差"
  - "死代码清理：AiAgentSettingsView/CameraBeautySettingsView/AboutView/AddModelSheet/EditApiKeySheet/SettingsM3ToggleRow 已删（git 历史可恢复）"
