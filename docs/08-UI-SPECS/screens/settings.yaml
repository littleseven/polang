# ============================================================================
# 设置屏完整产品规格书（Settings Screen Spec）
# ============================================================================
# 基准端：Android SettingsScreen.kt (1319行) + SettingsBaseComponents.kt +
#        SettingsAiAgent.kt + SettingsServerAuth.kt + DataPrivacyScreen.kt
# 用途：iOS 重做的唯一输入，不读 Android 源码
# 范围：iOS 当前阶段可实现的设置项（Android 专属项如 MIUI/电池优化/无障碍 标为 not_applicable）

# ============================================================================
# 1. 总体结构
# ============================================================================
root:
  type: navigation_stack
  background: "systemGroupedBackground"
  main_menu:
    layout: scrollable_column
    padding: { horizontal: 10, vertical: 6 }

# ============================================================================
# 2. 主菜单（SettingsMainMenu）
# ============================================================================
main_menu:
  # ① 账号英雄卡片（顶部全宽置顶行，反映登录态）
  account_hero_card:
    type: card
    shape: { corner_radius: 16 }
    background: "surfaceContainerHighest"
    padding: 16
    content:
      avatar:
        size: 48
        # 头像跟随人物页「这是我」标记：有封面时显示本人人脸（faceAware 裁剪防砍头），
        # 未标记/无封面/封面已删时回退默认 person 图标（PersonRepository.observeSelfAvatar）
        fallback: { icon: person, background: "primaryContainer", tint: "onPrimaryContainer" }
        badge:                                    # 2026-08-26 新增：右下相机角标
          icon: { material: photo_camera, sf: "camera.fill" }
          align: bottom_end
          click: "avatar_capture(target=Self, origin=SETTINGS_PAGE) → navigate(Screen.Camera)"  # 拍「我」头像并设封面，详见 dedup 设计规范 §11.2
      info:
        logged_in:
          email_font: { size: 16, weight: medium }   # titleMedium
          quota_text: "$used / $limit"                # bodySmall, onSurfaceVariant
        not_logged_in:
          title: "Account"                             # 账号
          desc: "Sign in for more quota and features"  # 注册账号享受更多额度与功能
      click: navigate_account

  # ②~⑤ 列表式分组（SettingsListSection + SettingsListRow）
  # 2026-08-26 设计稿 settings/main_list 落地：替代原「主题/语言快选卡 + 2 列分类卡片网格」，
  # 行 = 圆形彩色图标块 + 标题 + 可选右值（当前选中），组间分隔线 SettingsListDivider。
  list_sections:
    - id: personalization                          # 个性化
      rows:
        - { id: theme,    icon: dark_mode, icon_block: vibrantOrange, title: "Theme",    value: current_selection, click: theme_choice_dialog }     # 主题模式：弹层单选 system/light/dark
        - { id: language, icon: language,  icon_block: vibrantBlue,   title: "Language", value: current_selection, click: language_choice_dialog }  # 语言：弹层单选 system/English/中文/繁體中文/Español/Français
    - id: features                                 # 功能
      rows:
        - { id: people,          icon: account_circle, icon_block: vibrantGreen,     title: "People",          target: people }
        - { id: ai_memory,       icon: psychology,     icon_block: primaryContainer, title: "AI Memory",       target: memory_facts }
        # 相册扫描：原 Gallery 行 2026-08-26 更名（gallery_settings key，与 TagControl 页标题同源）
        - { id: gallery_scan,    icon: photo_library,  icon_block: vibrantOrange,    title: "Gallery Scan",    target: gallery }
        # 相册整理（去重 2.0）一级入口：2026-08-26 新增，切主页面 Pager 页 1（dedup 设计规范 §11.1）
        - { id: gallery_cleanup, icon: burst_mode,     icon_block: vibrantPurple,    title: "Gallery Cleanup", target: gallery_cleanup }
        - { id: camera,          icon: camera_alt,     icon_block: vibrantPink,      title: "Camera",          target: camera }
    - id: ai_system                                # AI 与系统
      rows:
        - { id: model_center,  icon: cloud_download, icon_block: vibrantGreen,     title: "Model Center",           target: model_center }
        - { id: remote_models, icon: cloud,          icon_block: status_info,      title: "Remote Models",          target: remote_models }   # 原 API Models 卡
        - { id: local_models,  icon: memory,         icon_block: vibrantPink,      title: "Local Models",           target: local_models }
        - { id: channels,      icon: forum,          icon_block: vibrantOrange,    title: "Communication Channel",  target: channels }
        - { id: sandbox,       icon: verified_user,  icon_block: primaryContainer, title: "Sandbox & Permissions",  target: sandbox }
    - id: others                                   # 其他
      rows:
        - { id: data_privacy, icon: privacy_tip, icon_block: vibrantBlue,  title: "Data & privacy",     target: data_privacy }
        - { id: developer,    icon: terminal,    icon_block: warningAmber, title: "Developer Options",  target: developer, visible_when: developer_options_unlocked }

  # ⑥ 版本页脚（原 About 卡收敛为页脚）
  version_footer:
    text: version_info
    hidden_interaction: "连点 7 次解锁开发者选项"

# ============================================================================
# 3. AI Assistant 分类页（ai_agent）
# ============================================================================
ai_agent:
  sections:
    - title: "AI Agent"
      desc: "AI assistant configuration"
      items:
        - auto_execute_plans:
            type: switch
            title: "Auto Execute Plans"
            default: true
            desc: "Automatically execute plans without confirmation"
        - agent_mode:
            type: chips
            title: "Mode"
            options: [remote]
            default: remote
        - silent_trash:                 # 「删除不再询问」2026-09-12 新增（37a9e4c6d；Android 位于 agent_gallery_access 权限行之后）
            type: switch
            title: "Delete Without Asking"        # settings_silent_trash_title
            default: false
            show_when: "android_api >= 31"        # canManageMedia 检查口为 API 31+ 新增，低版本不显示该行
            summary:
              granted: "Deleting and moving to Trash no longer shows a system confirmation."   # settings_silent_trash_summary_granted
              denied: "Allow media management in system settings to enable silent deletion."   # settings_silent_trash_summary_denied
            behavior: "开 + 持 MANAGE_MEDIA → 上滑删除/整理删除直写 IS_TRASHED 静默回收（零系统弹框，失败子集回落 token 通路）；开关照存，未授权开启时引导跳 ACTION_REQUEST_MANAGE_MEDIA 系统授权页；权限状态 ON_RESUME 刷新"
            ios: not_applicable          # iOS deleteAssets 系统强制确认框，无静默等价（gallery-grid.yaml §16b/§26 台账）

    - title: "Remote Models"           # 远程推理
      items:
        - remote_models_section:
            type: custom                # RemoteModelsListSection（iOS 对等 ModelCenterView）；
                                        # 供应商清单 SSOT 在 shared RemoteModelConfig.PROVIDERS
                                        # （tokenhub/kimi/deepseek/openai/anthropic）
                                        # 2026-08-21：组尾「添加模型」行改为导航 add_remote_provider 页
                                        # （原 AddProviderModelDialog 弹窗流程下线）
            add_entry_target: add_remote_provider
        - assistant_persona:            # 2026-08-22 新增
            type: option_chips          # 单选 chips（Android CompactOptionChips / iOS FlowLayout + capsule Button），maxLines=2
            title: "Assistant Personality"  # 助手性格
            options: [default, warm_caring, lively_playful, crisp_direct]
            default: default
            persistence:
              android: "DataStore assistant_persona (enum name)"
              ios: "@AppStorage(\"assistant_persona\")"
            effect: "chat system prompt 尾段注入性格段（五语按界面语言选段），下一条消息生效；default 不注入"
            desc_per_option: true       # 选中项下方显示一句话描述

    - title: "Voice Control"            # 语音控制（2026-08-19：语音全面默认关闭，本组为唯一开启入口）
      items:
        - voice_mode:
            type: chips
            title: "Voice Command"
            options: [disabled, push_to_talk, wake_word]
            default: disabled           # 门控 Chat 页 / Agent 共享面板输入框语音按钮：≠disabled 才显示
        - voice_entry:
            type: switch
            title: "Voice Control Entry"  # 相机页语音控制悬浮钮（RecordVoiceOver）
            default: false
        - ai_chat_entry:                # 2026-08-19 新增
            type: switch
            title: "Camera AI Chat Entry" # 相机页 AI 对话悬浮钮（KeyboardVoice 图标）
            default: false
        - asr_model:                   # 仅 mode≠disabled 时显示
            type: chips
            show_when: "voice_mode != disabled"
            options: "downloaded ASR models or fallback text"
        - kws_model:
            type: chips
            show_when: "voice_mode == wake_word"
            options: "downloaded KWS models or fallback text"

# ============================================================================
# 3c. 添加远程模型页（add_remote_provider，2026-08-21 新增：弹窗改页面）
#     路由 settings/add_remote_provider（精确路由，优先于 settings/{category}）
# ============================================================================
add_remote_provider:
  top_bar:
    title: "Add Remote Model"          # 添加远程模型（add_remote_model_title）
    back: true
  sections:
    - connected_providers:             # 「已接入」（provider_section_connected）
        label_font: { size: 13, color: "onSurfaceVariant" }
        source: "shared RemoteModelConfig.PROVIDERS（SSOT，双端共享，filter isVisible）"
        card_style:
          background: "surfaceContainerHighest"
          shape: { corner_radius: 12 }
        divider: { inset_start: 56 }
        row:
          height: 64
          badge:                       # 品牌色圆角字母徽章
            size: 28
            corner_radius: 8
            letter: "白色 SemiBold；Kimi=M(Moonshot)、TokenHub=T，其余取名称首字母"
            colors: { openai: "#000000", anthropic: "#D97757", deepseek: "#4D6BFE", kimi: "#4F378B", tencent: "#0052D9" }
          title: { font: { size: 15, weight: semibold } }        # displayName
          subtitle: { font: { size: 12 }, color: "onSurfaceVariant" }  # 「GPT-5 · GPT-4.1 等 4 个预置模型」动态生成
          trailing:
            configured_tag:            # 该 providerId 已有 isConfigured 模型时显示
              text: "Configured"       # remote_model_configured
              font: { size: 11 }
              color: "#0B9E4A"
              background: "#0B9E4A @ 12%"
            chevron: true
          click: "→ provider_config/{providerId}"
    - more_providers:                  # 「更多供应商」（provider_section_more）
        label_font: { size: 13, color: "onSurfaceVariant" }
        note: "静态列表，不可点击、无 chevron，右侧灰色「即将支持」胶囊"
        rows:
          - { name: "Google Gemini", subtitle: "Gemini 2.5 Pro · Flash", badge: "G 渐变蓝紫" }
          - { name: "通义千问", subtitle: "Qwen3 Max · Qwen Plus", badge: "Q #7147E8" }
          - { name: "智谱 AI", subtitle: "GLM-5 · GLM-4.6 系列", badge: "Z #3B5BFD" }
          - { name: "xAI", subtitle: "Grok 4 · Grok Code", badge: "X #202124" }
          - { name: "Mistral AI", subtitle: "Mistral Large · Codestral", badge: "M #FF7000" }
          - { name: "OpenRouter", subtitle: "200+ 模型聚合 · OpenAI 兼容", badge: "OR 9sp #6566F1" }
    - custom_provider:                 # 底部独立卡片（custom_provider_name）
        badge: "+ #00E676（vibrantGreen）"
        subtitle: "OpenAI 兼容协议 · 自定义 Base URL"
        chevron: true
        click: "→ provider_config/custom"

# ============================================================================
# 3d. 供应商配置页（provider_config/{providerId}，2026-08-21 新增）
#     providerId=custom 时为自定义供应商形态（额外 Base URL、无预置模型列表）
# ============================================================================
provider_config:
  top_bar:
    title: "$provider.displayName"     # 自定义形态显示「自定义供应商」
    back: true
  summary_card:                        # 供应商摘要卡
    badge: "同 add_remote_provider 徽章规则"
    title: { font: { size: 15, weight: semibold } }
    subtitle: "官方服务 · OpenAI 协议 / Anthropic 协议（按 protocol 字段）；自定义形态为「自定义供应商 · OpenAI 兼容协议」"
  api_key_section:
    label: "API Key"
    card_fields:
      - base_url:                      # 仅自定义供应商形态
          placeholder: "https://api.example.com/v1/"
      - api_key:
          style: "内凹浅色底（surfaceVariant 60%）、圆角 10、无指示线、密码掩码"
          privacy_hint: "API Key 仅保存在本机，不会上传到我们的服务器"
      - console_link:                  # 仅 provider.apiKeyUrl 非空时显示（RemoteModelProvider.apiKeyUrl）
          text: "前往 XX 控制台获取 →"
          color: "vibrantBlue"
          action: "系统浏览器打开 apiKeyUrl"
  model_section:
    label: "选择模型"
    preset_models:                     # 单选列表（仅预置供应商）
      row: { title: "$modelId", desc: "官方预置模型", trailing: "选中项右侧 vibrantBlue ✓" }
    custom_model_id_row:               # 末尾「自定义模型 ID」行，chevron 展开内联输入框
      subtitle: "填写任意模型名称，如 gpt-5-pro"
      note: "展开时覆盖预置单选（语义同原对话框）；自定义供应商形态只有此输入框"
  primary_button:
    text: "添加模型"                   # add_model
    style: "全宽 48 高，圆角 12，vibrantBlue 底白字"
    enabled_when: "API Key 非空且已选模型（或已填自定义模型 ID）；自定义形态另需 Base URL 非空"
    on_save: "RemoteModelConfigs.addConfig upsert → toJson 回写 UserPreferences（与 AddProviderModelDialog 同路径）→ 弹回远程模型列表页"

# ============================================================================
# 4. 账号分类页（account）
# ============================================================================
account:
  logged_in:
    header:
      avatar: { icon: person, size: 56, background: "primaryContainer" }
      email_font: { size: 16, weight: medium }
      subtitle: "Server Account"
    quota_card:
      shape: { corner_radius: 16 }
      background: "surfaceContainerLow"
      content:
        title: "Quota"
        value: "$used / $limit"
        value_color: "primary (or error if ≥90%)"
        progress_bar: { height: 8, color: "primary" }
        remaining_text: "$remaining inferences remaining"
    actions:
      - { type: filled_tonal, icon: refresh, text: "Refresh" }
      - { type: outlined, icon: logout, text: "Logout" }
    danger_zone:
      - { icon: delete_sweep, text: "Clear Guest Data", color: error }
      - { icon: delete, text: "Delete Account", color: error, confirm: true }

  not_logged_in:
    registration_form:
      title: "Register"
      desc: "Create an account for more quota"
      fields:
        email: { type: text, placeholder: "Email" }
        verification_code: { type: text, placeholder: "Verification Code" }
      buttons:
        - { text: "Send Code", action: send_verification }
        - { text: "Register / Login", action: verify_code }

# ============================================================================
# 4b. 相机分类页（camera，2026-08-16 新增：相机页改版后重置入口迁入）
# ============================================================================
camera:
  sections:
    - title: "Camera State Memory"                       # 相机状态记忆
      desc: "Remember the last camera parameters and toggles on next launch."
      items:
        - reset_camera_to_default:
            type: clickable_row
            title: "Reset Camera to First-Install Defaults"
            desc: "Restore all camera parameters to first-install defaults, effective immediately."
            leading_icon: restart_alt
            confirm_dialog: true                          # AlertDialog 二次确认（OK/Cancel）
            action: resetCameraMemoryState                # 经 cameraMemoryStateFlow 即时水合生效
            note: "iOS 对等实现待定（iOS 暂无相机状态记忆持久化）"

# ============================================================================
# 5. 数据与隐私（data_privacy）
# ============================================================================
data_privacy:
  sections:
    - title: "Account Data"
      body: "Your email is used only for authentication..."
    - title: "Device Identifier"
      body: "A device ID is generated for guest quota tracking..."
    - title: "Data Retention"
      body: "Chat history is stored locally on your device..."
    - title: "Data Deletion"
      body: "You can delete all data at any time..."
    - title: "Local Processing"
      body: "All media processing (beauty, tagging, face detection) runs 100% on-device..."
    - title: "Remote Processing"
      body: "Only text and metadata are sent to remote LLMs for inference. No photos or videos leave your device."
    - title: "Contact"
      body: "budao.gs@gmail.com"
  link:
    text: "View Full Privacy Policy"
    url: "https://polang.net/privacy-policy/"

# ============================================================================
# 6. 关于（about）
# ============================================================================
about:
  items:
    - version: { label: "Version", value: "{CFBundleShortVersionString} ({CFBundleVersion})" }
    - open_source: { label: "Open Source Licenses", target: license_list }
    - github: { label: "GitHub", url: "https://github.com/littleseven/polang" }

# ============================================================================
# 6.5 开发者选项页（developer，2026-08-15 补全）
# ============================================================================
# 入口：主菜单「Developer Options」卡（icon: terminal）直接显示。
# ⚠️ 平台差异（2026-08-15 用户定）：Android 需版本页脚连点 7 次解锁
# （developer_options_unlocked 持久化门控），iOS 不做门控直接展示——见 allowed_differences。
developer:
  navigation_title: "Developer Options"
  sections:
    - title: "Camera Preview Debug"             # 相机预览调试
      desc: "Recommended for debugging only."
      items:
        - debug:
            type: switch
            key: debug_ui_enabled               # 总开关，关闭时下列 4 项隐藏
            default: false
        - show_camera_info:
            type: switch
            key: show_camera_info_in_preview
            default: true
            show_when: "debug == on"
        - show_face_debug:
            type: switch
            key: show_face_debug_overlay
            default: true
            show_when: "debug == on"
        - show_log_overlay:
            type: switch
            key: show_log_overlay
            default: true
            show_when: "debug == on"
        - shader_debug_mode:
            type: chips                          # 单选 chips，最多 2 行
            key: debug_shader_mode               # Int 0-5
            title: "Shader Debug Mode"
            options: [Normal, Skin Mask, Warp Offset, BigEye Radius, ThinFace Radius, All Warp]
            default: 0                           # Normal
            show_when: "debug == on"
            note: "persistence-only：双端预览均不消费——Android CameraScreen 硬编码 0（避免调试模式蓝屏），iOS Metal shader 无 uDebugMode 分支；行下加注脚说明"

    - title: "Diagnostics & Logs"               # 诊断与日志
      items:
        - llm_call_log:
            type: nav_row
            title: "LLM Call Log"
            desc: "View LLM inference, tool call and JS run logs"
            ios_state: implemented               # → DiagnosticLogView（三层日志查看器，见 §6.6）
        - log_modules:
            type: chips_multi                    # 多选 chips，最多 3 行（对标 Android LogModuleConfigSection）
            title: "Log Modules"
            key: log_module_config               # UserDefaults JSON：{"enabledModules":[...]}，与 Android 同构
            options: [Face Detection, Rendering, Beauty, Agent, Camera, Download, Settings, Orchestrator, Chat, Semantic Search]
            default_enabled: [Agent, Orchestrator, Download, Settings, Chat, Semantic Search]  # FACE_DETECTION/RENDERING/BEAUTY/CAMERA 默认关
            note: "门控 shared Kotlin 侧 Logger 输出（IosModuleGatedLogger，tag 前缀最长匹配，未分类默认放行）；iOS Swift 侧 print 不经此门控"

    - title: "Developer Tools"                   # 开发测试工具
      build: debug_only                          # 仅 DEBUG 构建显示整区
      items:
        - image_download:
            type: nav_row
            title: "Image Download"
            ios_state: implemented               # → DebugScreenView（已有）
        - search_test:
            type: nav_row
            title: "Search Test"
            ios_state: disabled_android_only
        - jsbridge:
            type: nav_row
            title: "JSBridge"
            ios_state: disabled_android_only     # iOS JS 沙盒 Tier1-3 已具备但无调试页
        - accessibility:
            type: nav_row
            title: "Accessibility Service"
            ios_state: disabled_android_only     # Android 系统无障碍设置跳转，iOS 无等价

# ============================================================================
# 6.6 诊断日志查看器（DiagnosticLogView，自开发者选项进入，2026-08-15）
# ============================================================================
# 基准：Android features/debug/LlmCallLogScreen.kt（Room polang_llm_log.db 三表）。
# iOS 存储等价物：JSONL 文件（Application Support/llm_log/ 下 llm_calls.jsonl /
# tool_calls.jsonl / js_runs.jsonl），每行一条 JSON 记录，字段与 Android 实体一一对应；
# 单文件 >4MB 时截断保留尾部 ~2MB；shared iosMain 三层 recorder 注入点与 Android 相同
# （RemoteModelFactory.recorder / CommandExecutor.recorder / JsRuntime.recorder）。
# captureContent：DEBUG 构建记全文（request/response/script/resultPreview），
# Release 仅纯指标（隐私红线，双端一致）。
diagnostic_log_viewer:
  navigation_title: "LLM Call Log"
  tabs: [LLM, Tool, JS]                          # 顶部 segmented，对标 Android TabRow
  toolbar:
    refresh: { icon: arrow.clockwise }
    clear_all: { icon: trash, confirm: dialog }  # 清空三个 JSONL 文件
  list_row:                                      # 卡片行，倒序（最新在上）
    left_icon: "checkmark.circle.fill(green #2E7D32) / xmark.circle.fill(red #C62828)"
    time: { format: "MM-dd HH:mm:ss", font: label }
    source_chip: { bg: "primaryContainer", text: "onPrimaryContainer", corner: 8 }
    title: "LLM: model；Tool: commandType；JS: kind + 脚本首行 60 字符"
    subtitle: "latency ms + in/out tokens（LLM）| code/error 前 40 字符（失败时）"
    background: "surfaceVariant"
    corner_radius: 12
  detail:                                        # 点行进入，滚动页
    header: "完整时间 yyyy-MM-dd HH:mm:ss.SSS + model/kind + source"
    status_line: "成功/失败(绿/红) + latency + in/out tokens | code"
    sections:
      - { key: requestJson, title: "Request", show_when: "captureContent", pretty_json: true }
      - { key: responseJson, title: "Response", show_when: "captureContent && != null", pretty_json: true }
      - { key: script, title: "Script", tab: JS, show_when: "captureContent && != null" }
      - { key: resultPreview, title: "Result", tab: JS, show_when: "captureContent && != null", pretty_json: true }
      - { key: errorMessage, title: "Error", show_when: "!= null" }
      - { key: traceId, title: "Trace", mono: true, show_when: "!= null" }
    section_card: { title_row: "titleSmall + copy 按钮", body: "monospace 12pt" }
    release_no_content_hint: "captureContent=false 时内容区显示「Release 构建仅记录指标」说明卡"
  trace_pager: not_applicable                    # Android 有同 traceId 三层横滑 pager；iOS 首版详情仅单条，台账登记

# ============================================================================
# 7. iOS 当前阶段实现范围
# ============================================================================
ios_scope:
  implement_now:
    - "主菜单结构（账号英雄卡片 + 主题 + 语言 + 分类网格）"
    - "API Models（已完成）"
    - "Model Center（已完成）"
    - "Data & Privacy（隐私政策文本页）"
    - "About（版本号 + GitHub 链接）"
    - "主题切换（system/light/dark → colorScheme）"
    - "语言切换（english/中文/繁體/Español/Français → bundle locale）"

  placeholder_show_coming_soon:
    - "AI Memory（Phase 6.3 后续）"
    - "People（Phase 6.1 TAG 前置）"
    - "Channels（飞书/Telegram 远程控制）"
    - "Gallery（TAG 控制页等 Phase 6.1）"
    - "Camera & Beauty（人脸检测配置等 Phase 6.1）"

  not_applicable:
    - "Floating Chat Bubble（Android 悬浮窗，iOS 无等价）"
    - "Battery Optimization（Android 专属）"
    - "MIUI Auto Start / Permission Editor（小米专属）"
    - "Accessibility Service（Android 专属；开发者选项页内灰显标注 Android only）"
    - "Developer Options → Search Test / JS Bridge（Android debug 专属，iOS 行灰显标注；Image Download iOS 已实现；LLM Call Log/Log Modules iOS 已实现——见 §6.5/§6.6）"

# ============================================================================
# 8. 通用组件规格
# ============================================================================
components:
  settings_section:
    type: card
    background: "surfaceContainerHighest"  # iOS: secondarySystemBackground
    elevation: 0
    shape: { corner_radius: 12 }
    padding: { horizontal: 12, vertical: 10 }
    title_font: { size: 14, weight: medium }
    title_color: "onSurface"
    desc_font: { size: 12 }
    desc_color: "onSurfaceVariant.opacity(0.6)"

  debug_option_row:       # Switch 行
    height: 44
    title_font: { size: 14 }
    title_color: "onSurface"
    desc_font: { size: 12 }
    desc_color: "onSurfaceVariant.opacity(0.6)"

  settings_clickable_row: # 导航行
    icon_size: 24
    icon_tint: "primary"
    title_font: { size: 14 }
    value_font: { size: 14 }
    value_color: "primary"
    arrow_icon: arrow_forward
    arrow_size: 20

  filter_chip:
    selected_bg: "primary"
    selected_text: "onPrimary"  # white
    unselected_bg: "surfaceVariant"
    unselected_text: "onSurface"
    font: { size: 13 }

# ============================================================================
# 9. 允许的平台差异
# ============================================================================
allowed_differences:
  - "卡片材质（Material elevation vs SwiftUI background）"
  - "Switch 控件原生外观"
  - "导航转场动画"
  - "开发者选项入口：Android 连点 7 次解锁门控，iOS 直接显示（2026-08-15 用户定）"
  - "开发者选项 Shader Debug Mode 双端 persistence-only（Android CameraScreen 硬编码 0；iOS Metal shader 无 uDebugMode 分支），chips 仅持久化不消费"
  - "开发者选项部分开发工具 iOS 灰显标注 Android only（Search Test/JSBridge/Accessibility 无对应页）"
  - "诊断日志：Android 存 Room 三表 + 同 traceId 横滑 pager；iOS 存 JSONL 文件 + 单条详情（pager 台账登记）"
  - "Log Modules 门控范围：双端均只门控 shared/平台 Logger 通道；iOS Swift 侧 print 不经门控"
  - "语音控制（iOS 暂无 sherpa-onnx；2026-08-19 起 Android 全部语音入口默认关闭，iOS Chat 语音占位按钮同步移除，voice 三组开关为 Android only 平台差异）"
  - "相册 TAG 控制页（iOS Phase 6.1 未落地）"
