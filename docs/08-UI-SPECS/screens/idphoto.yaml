# ============================================================================
ios_impl_map:
  new_files: "Features/IdPhoto/{IDPhotoScreen, IDPhotoViewModel, IdPhotoDomain(纯逻辑), components/*}.swift"
  entry: "MediaPagerView 底栏 pager_id_photo 按钮：替换 coming-soon toast → fullScreenCover(IDPhotoScreen(source:))"
  source_image: "ThumbnailLoader.fullResolution(PHAsset) → 长边 ≤1024 降采样"
  ort: "ORTSharedEnv.env + ORTFaceEmbedder 同款 session 形态（modnet.onnx, Documents/llm_models/modnet-onnx/）"
  mediapipe: "MediaPipeTasksVision ImageSegmenter（bundle selfie_segmenter.tflite）"
  model_fallback: "ModelDownloadManager.isModelDownloaded('modnet-onnx') 缺失 → enqueueDownload + Error 态（Android 语义）"
  slider: "DesignSystem/AppSlider（无 onFinished → 调用点 DragGesture 结束时 commit；边缘三滑杆共用）"
  top_bar: "Features/Gallery/Components/AppTopBar + AppTopBarAction（48/17Medium 对齐）"
  tokens: "IdPhotoTokens（DesignTokens.swift 已生成）+ Spacing/AppRadius/AppColorScheme.dark"
  save: "PhotoSaver.saveToLibrary(UIImage)（JPEG 0.95，传 UIImage 保 EXIF 方向先例）"
  i18n: "Localizable.xcstrings 五语（en/zh-Hans/zh-Hant/es/fr），键名=§11 下划线键"
  tests: "纯逻辑域（framing_math/edge_adjust/compose/stroke replay/specs 表）移植 Android JVM 测试语义 → PoLangTests"

