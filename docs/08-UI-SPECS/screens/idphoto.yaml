# 14. 红线规则（实现期硬约束）
# ============================================================================
hard_rules:
  - "布局结构零容差对齐定稿截图（信息层级/元素顺序/默认值）"
  - "预览框渲染禁止子视图 scale 组合（§2.1 render_contract）"
  - "抠图 100% 端侧（[PRIVACY]）；模型缺失走下载中心，不做远程兜底"
  - "所有新尺寸/颜色引用 IdPhotoTokens / 既有 token；禁止内联 hex/dp"
  - "全部用户可见文案走 xcstrings 五语（§11 全量键表）"
  - "shared 模块零改动（本功能无 KMP 参与契约）"
