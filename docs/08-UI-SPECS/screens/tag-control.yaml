# ============================================================================
# TAG 生成控制页规格书（Tag Control Screen Spec）—— v4 顶栏+仪表环+底操作条（2026-10-02）
# ============================================================================
# 基准端：Android features/gallery/components/TagGenerationControlScreen.kt（v4 重写）
# 视觉定稿：Ardot `organize/tag_control`（空闲 478:10）/ `organize/tag_control_running`
#        （运行 478:89）/ `organize/tag_control_paused`（暂停 479:5）/
#        `organize/tag_stage_sheet`（阶段操作弹层 172:113）
#        （2026-10-02 用户在 Ardot 亲自重设计三帧；v3 条卡分工稿作废）
# 用途：iOS TagScanScreen 重写的唯一输入，不读 Android 源码
# v4 四大决策（相对 v3）：
#   1) 骨架改为 progBar → top_bar → content(ringHero+stages) → bottom_bar 四段固定结构；
#      钉住状态条（ScanStatusStrip）退役，状态/进度由 progBar + top_bar 计数承载
#   2) ringHero 仪表环回归「全库口径」：环心 48sp 大百分比=库级 AI 打标完成率（口径立法不变）；
#      本轮会话只以「x / y 计数」出现在 top_bar，不再染指环（环走全库、条走本轮，分工清晰）
#   3) RegenSheet 二级弹层（按类别/时间精细重生成）整体下线；阶段重处理改由
#      「阶段行长按」弹 StageActionSheet 承接（点按仍=导航，浏览归浏览）
#   4) bottom_bar 常驻主/次双钮（52dp r12 16sp SemiBold；次钮=描边幽灵），
#      替代 v3 卡内按钮集；idle 次钮「稍后」=宿主切回整理 tab
# 数据/执行链：TagScanOrchestrator / TagGenerationService 既有不动——v4 是纯控制页 UI 重设计
# 口径立法（全 app 唯一对外百分比）：库级 AI 打标完成率 =
#   round((totalMedia − remainingPass3) / totalMedia × 100)，计算点 domain
#   LibraryCompletion.percentRounded()，环心大数字/通知/任务中心同源同舍入。
#   任务级进度只允许「x / y 计数」与「第 x/y 张」自然语言形态，禁止渲染为百分比。

tag_control:
  type: full_screen
  background: "colorScheme.background"
  chrome:                                          # 嵌入 OrganizeHome（整理|扫描双 tab 宿主）
    capsule_switch:                                # 宿主提供（r24 track=surfaceVariant pad6）
      active_tab: "扫描 = primary 底 + onPrimary 14sp SemiBold"
      inactive_tab: "整理 = 无底 + onSurfaceVariant 14sp Regular"
    note: "embedded 态 contentWindowInsets 清零（对齐 DedupHomeScreen）；胶囊条即唯一页头"

  # ── 段 1：progBar（胶囊正下方 4dp 全宽本轮进度条）──
  prog_bar:
    height: 4
    track: surfaceVariant
    fill: "primary 按 sessionFraction（本轮 x/y）；暂停态=warningAmber (#FFA000)"
    idle: "0 宽（track 仅存）"
    running_effect: "填充段上 56dp 白色 0.75 高亮带 1.1s 循环扫过（流光）"

  # ── 段 2：top_bar（48dp surface 底标题栏）──
  top_bar:
    height: 48
    background: surface
    padding_h: 12
    title: { key: "tag_scan_page_title = 扫描整理/Scan & organize", size: 15, weight: SemiBold, color: onSurface }
    counter:                                       # 会话活跃/暂停时出现；空闲只有标题
      count: "<x / y> 15sp SemiBold onSurface（本轮会话计数）"
      subline:
        running_eta: "tag_scan_top_eta = 本轮 · 预计 %1$s"
        running_no_eta: "tag_scan_top_running = 本轮 · 进行中"
        paused: "tag_scan_top_paused = 本轮 · 已暂停"
        style: { size: 11, color: onSurfaceVariant }

  # ── 段 3：content（滚动列，pad16/12，区块间 8dp）──
  layout: vscroll
  sections_order: [ring_hero, mutex_cards, stages, guard_banner]

  ring_hero:                                       # r16 surfaceContainer 卡，pad20/14/12
    card: { background: surfaceContainer, corner_radius: 16 }
    tap: "整卡可点 → 已打标照片视图（相册按 AI 已打标筛选；数字对齐=环%）"
    dial:                                          # 200dp 容器 / 176dp 环
      stroke: 12
      track: surfaceVariant
      arc: "顶部 12 点钟起点顺时针；运行=primary，暂停=warningAmber；圆头端点"
      center_number: "<percentRounded()%> 48sp SemiBold；运行=primary/暂停=warningAmber/空闲=onSurfaceVariant"
      running_effect: "40° 白 0.85 亮弧 1.5s 匀速绕环（彗星弧，叠加非替代）"
    hint: { key: "tag_scan_ring_hint = %1$s / %2$s 张 · %3$s", size: 13, color: onSurface, align: center }
    hint_status_word:
      ready: "tag_scan_status_ready = 准备开始"
      running: "tag_scan_status_running = AI 分析中"
      paused: "tag_scan_status_paused = 已暂停"
      done: "tag_scan_status_done = 已完成"
    principle: "环=全库口径恒定；状态色只活在弧/大数字（绿=跑，琥珀=停），容器不换色"

    results_panel:                                 # v4.1（2026-10-02）：环下分隔线+3×2 成果格（查看入口）
      principle: "成果格=查看内容；阶段行=扫描控制——浏览与操作彻底分家"
      cells:                                       # 数字 20sp SemiBold + 6dp 彩点 + 11sp 标签 + 14dp chevron
        - { count: "<withFace>", label: "tag_result_faces_label = 含人脸照片", dot: "#FF7EB0", tap: "相册 FACES 视图" }
        - { count: "<personCount>", label: "tag_result_people_label = 识别人物 · N 位已命名", dot: "#9B8CFF", tap: "人物页" }
        - { count: "<cityCount>", label: "tag_result_cities_label = 足迹城市", dot: "#22D3EE", tap: "城市选择弹层 → 相册 CITY 视图" }
        - { count: "<groupPhotoCount>", label: "tag_result_group_label = 合照", dot: "#4ADE80", tap: "相册 GROUP 视图（face_embeddings ≥2 人聚合）" }
        - { count: "<selfPhotoCount 或 —>", label: "tag_result_self_label = “我”的照片", dot: "warningAmber", tap: "已标记→相册 SELF 视图；未标记→snackbar 引导去人物页标记" }
        - { count: "<withLabels>", label: "tag_result_tags_label = 已打内容标签", dot: "primary", tap: "相册 TAGGED 视图" }
      city_sheet: "ModalBottomSheet 城市列表（getCityGroups，城市名+张数）→ 点选 CITY 请求"
      ring_tap: "环卡整体不再可点（标签格承接已打标视图）"

  mutex_slots:                                     # 同槽位互斥附属卡（沿用 v3 语义）
    aesthetic_card: { visible_when: "aestheticProgress!=null 且 liveModel==null" }
    interrupted_card:
      visible_when: "liveModel==null 且 无美学进度 且 tagscan:main 任务 FAILED（进程死亡对账）"
      primary: "tag_scan_resume_breakpoint（增量续扫=断点续跑）"

  stages:                                          # v4.1：点按=该阶段扫描控制（StageActionSheet）；查看职责移交成果格
    lock: "无（扫描中可操作）"
    rows:                                           # StageRow ×4，60dp 高，pad_h 12
      - { title: "tag_pass_title_face", desc: "tag_pass_scope_face（空库回落静态键）", trailing: "<%> 12sp SemiBold primary + chevron", tap: "StageActionSheet(FACE)=阶段扫描控制" }
      - { title: "tag_pass_title_cluster", desc: "tag_pass_desc_cluster", trailing: "<人物数>（计数非百分比）", tap: "StageActionSheet(PEOPLE)" }
      - { title: "tag_pass_title_content", desc: "tag_pass_scope_content", trailing: "<%>", tap: "StageActionSheet(CONTENT)" }
      - { title: "tag_pass_title_aesthetic", desc: "tag_pass_scope_aesthetic", trailing: "<%>", tap: "StageActionSheet(QUALITY)" }
    row_icon: "28dp r7 色底芯片（12% 透明度）+ 18dp 图标，色板 [#FF7EB0, #9B8CFF, #22D3EE, #4ADE80]"
    trailing_note: "行口径=tagPassProgress().percentRounded()，与环心大数字同源同舍入"

  guard_banner: "BackgroundScanGuardBanner 殿后（缺失项未确认时显示，先检查再提醒）"

  # ── 段 4：bottom_bar（常驻主/次双钮）──
  bottom_bar:
    padding: "16/12 + navigationBarsPadding"
    gap: 10
    primary: { height: 52, corner_radius: 12, background: primary, foreground: onPrimary, font: "16sp SemiBold" }
    secondary: { height: 52, corner_radius: 12, background: transparent, stroke: "outlineVariant 1dp", foreground: onSurfaceVariant, font: "16sp SemiBold" }
    states:
      idle: { primary: "tag_scan_btn_start = 开始扫描（startScanWithGuard→增量）", secondary: "tag_scan_btn_later = 稍后（宿主切回整理 tab）" }
      running: { primary: "tag_scan_btn_pause_scan = 暂停扫描", secondary: "tag_scan_btn_stop = 停止（cancel）" }
      paused: { primary: "tag_scan_btn_resume_scan = 继续扫描", secondary: "tag_scan_btn_restart = 重新开始（cancel→800ms→增量重起）" }
      pausing_cancelling: { primary: "disabled（tag_scan_state_pausing/cancelling）", secondary: "停止" }
      terminal_with_failures: { primary: "tag_scan_retry_failed_items", secondary: "停止" }

  # ── 阶段操作弹层（长按触发；视觉=organize/tag_stage_sheet 172:113）──
  stage_action_sheet:
    background: surfaceContainerHigh
    options:
      - { title: "tag_stage_action_new", desc: "tag_stage_action_new_desc", badge: "tag_action_recommended" }
      - { title: "tag_stage_action_full", desc: "tag_stage_action_full_desc", confirm_first: true }
    full_confirm_dialog: { title: "tag_stage_full_confirm_title", message: "tag_stage_full_confirm_msg", positive: "tag_stage_full_confirm_ok" }
    intents: "intentScanPass1/2/3(±Full)、intentScoreAesthetic(±Full)（既有，语义不变）"

  # ── 动画规格（RUNNING 才动；暂停/过渡/终态静止）──
  scan_animations:
    prog_bar_shimmer: "见 prog_bar.running_effect（1.1s）"
    dial_comet: "见 ring_hero.dial.running_effect（1.5s LinearEasing）"
    engine: "全部 Compose infiniteTransition；iOS 以等价 TimelineView 对齐节拍(1.1s/1.5s)"

  # ── v4 删除清单（相对 v3）──
  removed_components:
    - "ScanStatusStrip 钉住状态条（波纹点+阶段名条）→ progBar+top_bar 计数替代"
    - "HeroCard 单锚点卡（统计区+按钮集）→ ringHero 环卡 + bottom_bar 常驻双钮分家"
    - "RegenEntryRow 入口行 + RegenSheet 二级（类别/时间 chips + 覆盖开关）整体下线"
    - "卡内 r12 h48 按钮组（Primary/Secondary/Ghost 三件套）→ bottom_bar 52dp 双钮"
    - "tag_regen_entry / tag_fine_control_title 入口文案随入口消失（键暂留存库）"
  added_components:
    - "progBar / top_bar / bottom_bar 三段固定骨架（v4 设计稿）"
    - "阶段行长按 → StageActionSheet（combinedClickable）"

  # ── 状态机 ──
  state_machine:
    idle: "progBar 0 + top_bar 仅标题 + 环=全库%(灰数字)+准备开始 + [开始扫描][稍后]"
    scanning: "progBar 本轮分数(绿+流光) + top_bar x/y+ETA + 环=全库%(绿弧+彗星)+AI 分析中 + [暂停扫描][停止]"
    pausing_cancelling: "过渡态：主钮 disabled 占位，次钮停止"
    paused: "progBar 冻结(琥珀) + top_bar x/y+已暂停 + 环=全库%(琥珀弧)+已暂停 + [继续扫描][重新开始]"
    terminal_zero_failures: "liveModel 置空回落 idle 布局；环 hint 尾词=已完成"
    terminal_with_failures: "[重试失败项][停止]"
    interrupted: "对账 FAILED → interrupted_card 断点续扫（content 内互斥槽）"
    result_cell_tap: "六格分别 → FACES / 人物页 / 城市弹层→CITY / GROUP / SELF(或引导) / TAGGED"
    stage_row_tap: "四行 → StageActionSheet 阶段扫描控制（仅处理新增/全部重新处理）"
    later_tap: "宿主 onSelectTab(ORGANIZE) 切回整理 tab"

  back_stack: "系统返回（Android back / iOS NavigationStack pop）"

  platform_differences:
    capabilities: "扫描执行链 iOS=TagScanOrchestrator（既有）；UI 状态消费同源 sessionProgress 语义"
    i18n_keys: "v4 新键：tag_scan_page_title / tag_scan_top_eta / tag_scan_top_running / tag_scan_top_paused /
      tag_scan_ring_hint / tag_scan_status_{ready,running,paused,done} / tag_scan_btn_{start,later,pause_scan,stop,resume_scan,restart}；
      v4.1 新键：tag_result_{faces,people,cities,group,self,tags}_label / tag_result_self_unset /
      tag_city_sheet_{title,count} / gallery_view_{group,self}"
    allowed_differences:
      - "容器色可用两端等价 colorScheme 角色实现"
      - "四个导航目的地 iOS 侧若缺（评分排序视图/hasFace 筛选）：允许首版落地为等价页面（TagViewer/People），缺口登记台账"
      - "长按重处理 iOS 侧可用 contextMenu 或长按手势等价实现"
