# ============================================================================
# 12. 上下文附件（Context Attachment）— 2026-08-12 新增（B1 对齐）
# ============================================================================
# 基准端：Android ChatPhotoPickerSheet.kt / ChatScreen.kt stageImage 区
# iOS 现状：Coming Soon 桩；bridge.sendMessage 只收 text。本节定义对齐目标。
context_attachment:
  entry: input_bar.gallery_capsule          # 点 Gallery 胶囊（非 Coming Soon）
  picker:
    type: photo_picker                       # iOS = PHPickerViewController (AddOnly 配置)
    selection: single                        # 单选
    layout: bottom_sheet                     # 560dp / iOS sheet
    search_field: true                       # 内嵌搜索（浏览/搜索两态）
  # 选图后在输入栏上方展示的"暂存区"
  staging:
    visible_when: "pendingImageUri != null"
    layout: row
    thumbnail:
      size: chatContext.thumbSize            # 72dp
      corner_radius: chatContext.thumbRadius # 8dp
      face_aware: true                       # 按 faceFocusY 顶对齐裁切
    remove_button:
      position: top_end
      icon: close
    intent_chips:                            # 三意图 FilterChip（单选）
      layout: row
      spacing: 8
      items:
        - { id: UNDERSTAND,  label: "Understand",  icon: visibility }     # 理解
        - { id: FIND_SIMILAR, label: "Find similar", icon: image_search } # 找相似
        - { id: EDIT,         label: "Edit",        icon: edit }          # 编辑
      default: UNDERSTAND
  # 意图分发（隐私红线：图片文件不上传远程）
  intent_dispatch:
    UNDERSTAND:
      action: on_device_vlm                  # 端侧 Qwen3-VL-2B 图像理解
      privacy: "图片不离开设备；仅文本结论走远程"
    FIND_SIMILAR:
      action: on_device_image_search         # 端侧以图搜图 → MediaResultsCarousel
      privacy: "纯端侧"
    EDIT:
      action: navigate_photo_editor          # 直跳编辑器，不发推理
      privacy: "无推理"
    with_text:
      rule: "文本非空 → sendMessage(text, imageUri)，图片作为上下文提示（仅 URI 文本注入，像素不上传）"
  bridge_contract:                           # 见 contracts.md C-B1
    change: "ChatAgentBridge.sendMessage 增可选 attachment + intent 参数（向后兼容默认）"

# ============================================================================
# 13. JS 工具调用渲染（JS Toolcalls）— 2026-08-12 新增（B2 对齐）
# ============================================================================
# 基准端：Android ChatRunScriptCapability / QuickJsEngine / CapabilityDispatchHandler
# iOS 现状：仅 "Calling tools…" 文本；无 JS 引擎。本节定义对齐目标。
js_toolcalls:
  capability_exposure:
    manifest_add:                            # iOS ChatToolManifest 须新增
      - run_gallery_script                   # 委托 ChatToolService.runGalleryScript
      - draw_chart                           # 委托 ChatToolService.drawChart
  engine:
    # 设计决策（contracts.md C-B2-1）：选 quickjs-kt(KMP 同源) 或 JavaScriptCore(iOS 原生)
    # 推荐 quickjs-kt 以保持与 Android 引擎一致；若 iOS 切片不可用退 JavaScriptCore。
    selection: quickjs_kt_preferred_jsc_fallback
    contract: "复用 commonMain JsEngine/JsRuntime/JsBridge；iOS 写 actual + 注册 gallery.*/media.*/capability.dispatch handlers"
  rendering:                                 # 正常推理路径（非 AI 工程师）
    tool_indicator:
      text: "Calling tools…"                 # 正在调用工具（ChatStreamEvent.ToolCallStarted 触发）
      cursor_hidden: true
    chart_result:                            # draw_chart 产出
      message_kind: CHART                    # 独立全宽消息项（非嵌入文本气泡）
      ui: ChartSvgCard                       # SVG 卡片，tap 进横屏 pinch-zoom 预览
      bridge_kind: "ChatUiActionDto 须加 chart kind（携 svg+summary）"  # 见 contracts.md C-B2-2
    html_card_result:                        # render_html 产出（2026-09 新增，Android 先行）
      message_kind: HTML_CARD                # 独立全宽消息项；content=自包含 HTML（落库持久）
      ui: HtmlCard                           # WebView 卡片（动态测高 + 完全撑开（≥120dp 无上限，卡片不内滚、滚动全交外层列表）+ ResizeObserver 高度跟随 + 滑动防抖（高度进程级缓存/滑动冻结/2px 阈值）；卡片内直接交互，仅 a 外链点击进全屏落地页 HtmlLinkPreviewOverlay；滚动条隐藏）
      render_template: "wrapHtmlDocument 注入 viewport meta(width=device-width) + 响应式 reset；完整文档原样加载"
      layout_context: "组合根注入 RenderEnvironment（设备/屏幕/卡片宽高上限）→ prompt 动态尾段，引导 LLM 响应式排版"
      sanitize: "落库前 HtmlCardSanitizer 清洗（128KB 上限、剔除远程 script/iframe/object/embed/form/meta refresh；2026-09-25 起远程 img/CSS/a 外链放行，表现力优先）"
      lockdown: "禁文件/DOM Storage、零 JS 桥接；远程资源直拉，a 点击经 shouldOverrideUrlLoading 回传 onOpenLink 开落地页，卡片自身永不导航"
      ios_status: "TODO(ios-follow) HtmlCard.swift 照搬 ChartSvgCard WKWebView 模式 + 同款沙盒/动态测高/高度跟随/链接落地页"
    sandbox_badge:
      show_when: "replyUsedSandbox == true"
      icon: terminal
  write_confirmation:                        # capability.dispatch 写操作须用户确认
    trigger: "CommandRisk != READ_ONLY（delete/favorite/select/remember_*/forget_*）"
    dialog:
      title: "Confirm AI action"             # 确认 AI 操作
      body: "operation 描述"
      thumbnail_row: { size: 44, corner_radius: 6 }
      risk_line: "DESTRUCTIVE → 红；REVERSIBLE → 普通"
      buttons: [confirm, cancel]
    serialization: "单弹窗 Mutex，超时 120s → reject"

