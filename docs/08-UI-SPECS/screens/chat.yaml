# ============================================================================
# 聊天屏完整产品规格书（Chat Screen Spec）
# ============================================================================
# 基准端：Android ChatScreen.kt / ChatEmptyState.kt / BlinkCursor.kt
#        / MediaResultsCarousel.kt / ModelSelector.kt / Color.kt / Typography.kt
# 用途：iOS 重做的唯一输入，不读 Android 源码
# 值引用：尺寸引用 design-tokens.json 的 token 名

# ============================================================================
# 1. 总体结构
# ============================================================================
root:
  type: full_screen
  background: "background"          # MaterialTheme.colorScheme.background
  layout: vbox
  insets: "0,0,0,0"                 # Scaffold contentWindowInsets = 0
  ime_padding: true                 # Column.imePadding()，键盘弹起推输入栏上移

# ============================================================================
# 2. 顶部栏（ChatTopBar）
# ============================================================================
top_bar:
  # 几何 SSOT → docs/08-UI-SPECS/screens/topbar.yaml 变体 D（variant_iconrow）；本节仅保留 chat 专属行为
  background: "surface"
  status_bar_padding: true
  title: ""                         # ⚠️ 无标题文字
  left_actions:
    - { icon: arrow_back }          # 返回
    - { icon: menu, action: open_sidebar }  # 菜单 → 打开会话历史侧栏（§2.5）
  right_actions:
    - { icon: bug_report }          # 上报问题
    - { icon: add_comment, action: new_session }     # 新对话 = 新建会话并切换（非清空当前会话）
    - { icon: delete_sweep, action: clear_session }  # 清空对话 = 清当前会话消息 + 当前会话 LLM 记忆
  hide_when: fullscreen_preview_open

# ============================================================================
# 2.5 会话历史侧栏（ChatThreadSidebar）
# ============================================================================
chat_history_sidebar:
  trigger: top_bar.menu                 # 点菜单图标打开
  scrim:
    color: "black.opacity(0.3)"
    tap_action: dismiss
  panel:
    width: 280
    fill_height: true
    background: "surface"
    shadow: { elevation: 8 }
    enter_animation: slide_in_from_leading + fade
    exit_animation: slide_out_to_leading + fade
  header:
    layout: row_space_between
    padding: 16
    status_bar_padding: true
    title:
      text: "Chat History"              # 聊天历史
      font: { size: 17, weight: bold }  # titleMedium bold
    actions:
      - { icon: add, action: new_session, cd: "New Chat" }      # 新建会话
      - { icon: close, action: dismiss, cd: "Close" }           # 关闭侧栏
  search_field:
    placeholder: "Search history"       # 搜索历史
    padding: { horizontal: 16, vertical: 8 }
    filter: "title OR lastMessagePreview contains query (ignoreCase)"
  thread_list:
    layout: lazy_column
    sort: updatedAt_desc
    item:
      padding: { horizontal: 16, vertical: 12 }
      tap_action: "switch_session + dismiss"
      selected_background: "primary.opacity(0.12)"
      title:
        font_size: 15
        weight: "selected → bold | normal → regular"
        color: "selected → primary | normal → onSurface"
      preview:
        show_when: "lastMessagePreview 非空"
        font_size: 12
        color: "onSurface.opacity(0.6)"
        max_lines: 1
        padding_top: 2
      overflow_menu:
        icon: more_vert
        items:
          - rename:
              text: "Rename"            # 重命名
              dialog: "alert 带单行文本框（预填当前标题）；Save 仅非空可用；Save/Cancel"
          - delete:
              text: "Delete chat"       # 删除聊天
              confirm_dialog:
                title: "Delete Chat"    # 删除聊天
                body: "Delete \"{title}\"? This cannot be undone."  # 删除「{title}」？此操作不可撤销。
                buttons: [Delete, Cancel]

# ============================================================================
# 3. 消息列表
# ============================================================================
message_list:
  layout: lazy_column
  weight: 1                         # 填充可用空间
  horizontal_padding: 20            # 2026-08-18 三修：12→20（去头像后通栏文本需要更大呼吸感，用户定稿）
  item_spacing: 8                   # 消息间距 8dp
  auto_scroll:                      # 自动滚到底部
    triggers: [message_count_changed, last_message_content_changed]
    animation: ease

# ============================================================================
# 4. 空状态（ChatEmptyState）
# ============================================================================
empty_state:
  layout: column
  scrollable: true                  # 2026-08-22：8 条分组 chips 后内容超高，verticalScroll 防小屏裁切；弹性 weight 占位改为固定间距
  fill: true                        # fillMaxHeight
  horizontal_padding: 20
  alignment: center
  # 2026-08-22 密度优化 v2（真机反馈：问相册组首屏仅露一行）：头部压缩 + 行距收紧；
  # 2026-08-22 v3（真机反馈：头部过密）：示例词 8→6 条（每组 3 条）后头部行距回松——
  # top 24→28 / title 间距 10→12 / 副标题间距 4→6 / 链接 vpad 4→6 / groups 12→16 / 组间 10→12 / 组内 6→8 / 底部 8→10
  #（EN 6 条 chips 各占一行，第 6 条恰在首屏折叠线边缘，可滚动；CN 行更短自动 2 条/行，整页宽松）。
  # EN 头部文案缩短避免意外折行（title "Hi, I'm Xiaolang"、subtitle 单行化、guest link 缩至 44 字符防箭头孤行）。
  content:
    top_spacer: 28
    logo:
      box_size: 48                  # 48dp（72→56→48 两次密度优化）
      corner_radius: 16             # 随盒尺寸两档下调（22→18→16）
      background: "brandGradient"   # 品牌渐变 #1EA75B→#7CEFA8（chatBubble/brandGradient*），45° 对角，衬在图标残余透明角下
      border: none
      # 2026-08-18 二修（用户定稿）：内嵌图 = App launcher 前景（ic_launcher_foreground，108dp adaptive 画布，
      # 不透明内容 190/324 宽），1.75 倍放大居中 + ContentScale.Crop，透明边全部裁出框外、插画填满 LogoBox。
      # ⚠️ 禁止原尺寸/96dp 直接塞入（满幅插画顶满圆角、底部溢出）；曾评估 ardot 波浪标矢量方案，弃用。
      inner_image: app_launcher_foreground
      inner_image_zoom: 1.75        # 不透明区宽 190/324 → 需 ≥1.71 铺满盒宽；1.75 留密度桶余量，左右不得露渐变底
    title_spacer: 12
    title:
      text: "Hi, I'm Xiaolang"      # 你好，我是智能助手小浪（2026-08-22 v3：EN 缩短防折行）
      font: { size: 22, weight: semibold }
      color: "brandGradient"        # 渐变着色文字（Brush.linearGradient）
    subtitle_spacer: 6
    subtitle:
      text: "Search, edit, beautify — ask me anything!"  # 我能搜相册·修图·调美颜·找人找场景，随便问！（EN 单行化）
      font: { size: 14 }            # bodyMedium
      color: "onSurfaceVariant"
    # 访客轻量入口（2026-08-22 改版，设计稿 chat/empty-v2-guest guestLink）：
    # 前置注册卡片已移除——不再抢占空状态核心区域；访客模式仅在副标题下显示一行小字链接。
    # 纯文本点击态（无 TextButton 40dp 最小高度），padding 12/6（v3 回松）。
    guest_link:
      show_when: "isGuestMode"
      text: "Not registered? Sign up or use your Token →"  # 未注册？注册领免费额度，或配置自己的 Token →（EN 两次缩短：真机 48 字符仍折行，44 字符防箭头孤行）
      font: { size: 13 }
      color: "brandGradientStart"  # 能量绿 #1EA75B
      action: open_registration_sheet
    groups_spacer: 16               # 链接/副标题与示例分组之间的固定间距（可滚动容器不可用 weight；v3 12→16）
    example_groups:
      # 2026-08-22 v3（设计稿 chat/empty-v2-guest）：示例词每组 3 条（8→6，真机反馈信息量适中即可）。
      # 每组 = 居中小标题（13sp onSurfaceVariant）+ FlowRow 流式 chips（行距 8/列距 14，整体居中）。
      # chip 图标按组内语义固定：
      #   找照片 = 日历#6BA6FF/人物#FF7EB0/夜色#9B8CFF；
      #   问相册 = 统计#4ADE80/相册#22D3EE/人物#FF7EB0。
      # 组间距 12，组内（小标题→chips）8，末组距输入栏 10；文本强制单行，极端窄屏/大字体省略号截断。
      layout: two_groups_flow_wrap_centered
      group_gap: 12
      label_font: { size: 13 }
      label_color: "onSurfaceVariant"
      chip_style:
        shape: { corner_radius: 22 }
        background: "surfaceContainerHigh"
        leading_icon: 16            # 彩色 Material 图标（按组内语义固定）
        text_font: { size: 14 }
        text_color: "onSurface"
        text_max_lines: 1           # 单行，溢出 ellipsis
        padding: { start: 12, end: 14, vertical: 8 }   # 2026-08-22 密度优化：10→8
      groups:
        - label: "Find photos"      # 找照片
          prompts:
            - "Find photos from last summer"
            - "Find photos with people"
            - "Search for night scene photos"
        - label: "Ask about your gallery"  # 问相册
          prompts:
            - "Give me a gallery health report"
            - "Find duplicate photos"
            - "How many selfies did I take?"
    # ⚠️ iOS 缺口（2026-08-22 v3 更新，走 /ios-follow 追齐）：iOS ChatEmptyState 仍为上一代设计——
    # Logo=64pt surfaceVariant 描边块+104pt chat_logo 位图（应为 48pt 渐变底块+App 图标 1.75x 裁剪 r16）、
    # 标题非渐变着色（应 brandGradient 22pt semibold）、chips 为无图标 Capsule（应 r22+16pt 彩色图标+两组各 3 条 flow）；
    # 且 iOS Chat 无任何访客注册引导（guest_link / guest_nudge 均缺，iOS 登录入口仅在设置页）。
    ios_gap: "ChatView.swift ChatEmptyState 落后 2026-08-22 定稿：见 §4 logo/example_groups/guest_link/guest_nudge"

# ============================================================================
# 4.1 访客渐进注册引导（guest_nudge，2026-08-22 新增；设计稿 chat/guest-nudge-sheet）
# ============================================================================
guest_nudge:
  principle: "后置渐进：先体验后引导。空状态无注册卡片；累计满阈值才主动弹层"
  counter:
    storage: datastore             # key=guest_chat_message_count（UserPreferencesRepository）
    scope: "guest 模式（远程模型且无 server token）下用户消息累计发送数，跨会话累计"
    reset_on: register_success     # updateServerAuth 时清零
  threshold: 20
  triggers:
    - when: "count == 20（恰好跨阈值当次，>20 不再弹）"
      actions: [insert_agent_notice_message, open_registration_sheet]
    - when: "服务端 quota_exceeded(403)"
      actions: [insert_quota_notice_message, open_registration_sheet]   # 硬兜底，原有路径
    - when: "空状态 guest_link 点击 / banner 按钮点击"
      actions: [open_registration_sheet]
  banner:
    show_when: "isGuestMode && count >= 20 && !dismissedThisSession"   # 关闭仅会话内有效，重启复现
    position: above_input_bar
    shape: { corner_radius: 16 }
    background: "surfaceContainerHigh"
    text: "Guest trial: 20+ rounds used"   # 访客试用已超 20 轮
    actions: [register_get_quota, use_own_token, dismiss]
  sheet:                            # ChatRegistrationSheet v2（双选项卡片）
    type: modal_bottom_sheet
    title: "Enjoying Xiaolang? Unlock the full experience"   # 喜欢小浪？解锁完整体验
    subtitle: "Register for free quota, or configure your own LLM Token. Either way, keep chatting."
    primary_cta:
      text: "Sign up with email · Get free quota"   # 邮箱注册 · 领免费额度
      style: "brand_gradient_fill r22 h48 white_semibold_15"
      action: expand_email_otp_form                 # 展开 EmailCodeAuthForm
    secondary_cta:
      text: "Use my own Token"                      # 配置自己的 Token
      style: "brand_outline_1.5 r22 h48 brand_semibold_15"
      action: navigate_settings_provider_config
    note: "{count} free conversations used · Manage anytime in Settings → AI Assistant"

# ============================================================================
# 5. 消息气泡（ChatMessageItem）
# ============================================================================
message_bubble:
  container:
    layout: box
    fill_width: true
    alignment: "user → centerEnd | agent → centerStart"

  max_width:
    text: 360                       # 文本消息最大宽度 360dp
    image: 240                      # 图片消息最大宽度 240dp

  # 圆角（不同角色不同切角）
  corner_radius:
    user: [20, 20, 4, 20]           # Compose RoundedCornerShape(topStart, topEnd, bottomEnd, bottomStart)：右气泡切角在 bottomEnd
    agent: [20, 20, 20, 4]          # 左气泡切角在 bottomStart

  # 背景色（2026-08-18 豆包范式定稿；2026-09-13 v2.2.3 换色 + 946a36db4 对比度修复）
  background:
    user_text: "userBubbleBg"            # 品牌实色 #2FE385（token chatBubble/userBubbleBg，双模式一致）；文字色 userBubbleOn #062B18（2026-09-13 起用户气泡文字接 token chatBubble/userBubbleOn）
    user_image_text: "userBubbleBg"      # 用户「图+文」气泡同绿底（Android isUser 含 USER_IMAGE_TEXT；caption 文字走 onSurface）
    agent_text: "none"                   # ⚠️ AI 文本无气泡：通栏纯文本流（2026-08-18 二修：去 28dp 渐变头像，用户定稿——头像多余）
    image: "surfaceVariant.opacity(0.4)" # 纯图气泡（USER_IMAGE/AGENT_IMAGE）
    error: "none"                        # 同 AI 正常（无气泡范式）

  # 内边距（用户气泡 18/14；AI 无气泡故无 padding，通栏无头像缩进）
  padding:
    text: { horizontal: 18, vertical: 14 }
    image: { horizontal: 6, vertical: 6 }

  # 文字样式（2026-08-18 三修：14/20 → 16/24，配合去头像通栏排版，用户定稿）
  text:
    user:
      color: "userBubbleOn"         # token chatBubble/userBubbleOn 深绿黑 #062B18（946a36db4：亮绿底白字对比度 ~1.9:1 → 深字 ~8:1）
      font_size: 16
      line_height: 24
      performance_line: "userBubbleOn.opacity(0.55)"   # 性能行 tint 同源（Android AgentMessageExtras）
    agent:
      color: "onSurface"
      font_size: 16
      line_height: 24
      markdown: true                # MarkdownText 渲染

  # 无时间戳显示
  timestamp_visible: false

  # 长按复制
  long_press:
    action: copy_to_clipboard
    toast: "Copied"

  # 图片内容布局（2026-08-16 补：修复 iOS「砍头2/大小不对齐」时反向提取 Android 定稿）
  image_content:
    user_image_text:                     # 上图下文（USER_IMAGE_TEXT）
      scale: fill_width                  # ContentScale.FillWidth：宽撑满气泡内容区，高随原始宽高比，零裁切
      fixed_height: none                 # ⚠️ 禁固定高 + Crop（会砍头；2026-08-16 真机反馈回归点）
      corner_radius: 12                  # 图自身圆角（≠气泡圆角 20）
      text_below: { color: onSurface, size: 16, line_height: 24, top_padding: 6 }  # 946a36db4：图文说明 white→onSurface
    agent_image:                         # AGENT_IMAGE（单发结果图）
      scale: fill_width                  # 同上；过期 → ExpiredImagePlaceholder
      corner_radius: 12
    edit_result:                         # AGENT_EDIT_RESULT（编辑结果卡）
      scale: fill_height                 # ContentScale.FillHeight：高定 200，超宽横向居中裁切
      height: 200
      max_width: 260
      corner_radius: 12
      expired_placeholder_height: 200

# ============================================================================
# 6. 流式指示器
# ============================================================================
streaming:
  # 思考态（首 token 到达前）
  thinking_indicator:
    layout: row
    dot_size: 6                     # 6dp 圆点
    dot_spacing: 5                  # 5dp
    vertical_padding: 4
    color: "onSurface"
    animation:
      type: alpha_pulse
      range: [0.3, 1.0]
      duration_ms: 400
      easing: ease_in_out
      stagger_ms: 160               # dot0=0, dot1=160, dot2=320
      repeat: reverse

  # 打字光标（流式中）
  blink_cursor:
    char: ">"                       # 终端风格 > 字符
    color: "onSurface"
    font: { size: 14, weight: bold }
    padding: { start: 2, bottom: 1 }
    animation:
      type: alpha_blink
      range: [1.0, 0.3]
      duration_ms: 500
      repeat: reverse

  # 流式布局
  layout:
    type: row
    alignment: bottom
    content:
      - text_column: { weight: 1 }  # Markdown 渲染区
      - cursor: { show_when: "showCursor" }

# ============================================================================
# 7. 输入栏（ChatInputArea）
# ============================================================================
input_bar:
  outer:
    padding: { horizontal: 12, vertical: 8 }
    nav_bar_padding: true           # navigationBarsPadding

  card:
    shape: { corner_radius: 28 }    # r28（token chatBubble/inputCornerRadius）
    border: { width: 1, color: "outlineVariant.opacity(0.35)" }  # 2026-08-18 新增细描边
    shadow: { elevation: 4, ambient_alpha: 0.08, spot_alpha: 0.12 }
    background: "surfaceContainerLowest"
    padding: { horizontal: 16, vertical: 14 }
  # 语音钮：surfaceContainerHigh 实底圆钮 + onSurfaceVariant@0.85 图标
  # 发送钮：品牌渐变实底圆钮（brandGradient*）+白字+品牌色光晕 shadow

    # 行 1：文本输入
    text_field:
      placeholder: "Ask AI Agent..."  # 向 AI 助手提问…
      placeholder_style: { font_size: 16, color: "onSurface.opacity(0.35)" }
      text_style: { font_size: 16, line_height: 24, color: "onSurface" }
      max_lines: 5
      keyboard: send

    # 行 2：按钮栏（SpaceBetween）
    # YAML 锚点须定义于首次引用之前（原 §8 定义导致 safe_load 报 undefined alias，2026-09-18 前移至此）：
    capsule_style: &capsule_style
      shape: { corner_radius: 16 }
      background: "surfaceVariant.opacity(0.5)"
      active_background: "primary.opacity(0.12)"
      padding: { horizontal: 10, vertical: 6 }
      icon_size: 16
      text_font: { size: 12 }
      text_color: "onSurface.opacity(0.7)"
      active_color: "primary"

    circular_button: &circular_button
      size: 36                      # 36dp 圆形
      icon_size: 22
      default_tint: "onSurface.opacity(0.6)"

    button_bar:
      layout: row
      alignment: space_between
      left_group:
        spacing: 8
        # 2026-08-22（用户定稿）：model_capsule 已删除——输入区不再显示模型切换胶囊，
        # 模型切换改由设置页承载；left_group 仅余 gallery / ai_engineer 两枚功能胶囊。
        items:
          - gallery_capsule:
              icon: photo_library
              text: "Gallery"
              style: *capsule_style
          - ai_engineer_capsule:
              icon: smart_toy
              style: *capsule_style
              active_bg: "primary.opacity(0.12)"
      right_group:
        spacing: 8
        items:
          - voice_button: *circular_button
            icon: keyboard_voice
            show_when: "voice_mode != disabled && asr_model_ready"  # 2026-08-19：语音默认关闭，语音模式开关（设置→沙盒与权限→语音控制）非 DISABLED 且语音 ASR 模型已下载就绪时才显示；隐藏时输入框仅文字模式
          - send_button:
              show_when: "hasContent && !isProcessing"
              style: *circular_button
              icon: send
              tint: "primary"
          - send_button_disabled_placeholder:  # 2026-08-19：语音模型未下载且无内容时，默认显示禁用态发送钮（替代不可用的语音入口）
              show_when: "voice_mode != disabled && !asr_model_ready && !hasContent"
              style: *circular_button
              icon: send
              tint: "onSurfaceVariant.opacity(0.4)"
              background: "surfaceContainerHigh"
              enabled: false

# ============================================================================
# 8. 复用组件规格
# ============================================================================
# capsule_style / circular_button 锚点定义已前移至 §7 button_bar 之前（YAML 锚点必须先定义后引用）。

# ============================================================================
# 9. 媒体结果轮播（MediaResultsCarousel）
# ============================================================================
media_results:
  container:
    padding: { horizontal: 12, vertical: 4 }
  title:
    found_template: "Found {N} photos for '{query}'"  # 找到 N 张「query」的照片
    refine_template: "Refined: {query} ({N})"          # 细化：query（N 张）
    empty_template: "No photos found for '{query}', try another word"
    font: { found: titleSmall_primary, empty: bodySmall_onSurfaceVariant }
  carousel:
    layout: lazy_row
    spacing: 8
    card_size: { width: 120, height: 150 }
    card_radius: 12
    card_image_scale: crop
    card_feedback_buttons: [thumb_up, thumb_down, refresh]
    card_date_label: "yyyy-MM-dd"

  # 回合内 upsert 去重（c4cea4995，2026-09-13；Android ChatViewModel.insertMediaResultsMessage 定稿口径）
  per_turn_upsert:
    rule: "同一用户回合（最后一条 user 消息之后）至多一张横滑卡片"
    trigger: "ReAct 多轮 search_media / refine_media_search / 拒绝措辞回退直搜均可能同回合多次产出"
    upsert_semantics: "replacePreviousInTurn=true（默认）：查本回合上一张卡片行，复用其 id 与 timestamp 原位替换（卡片位置不移动）"
    append_exception: "以图搜图（FIND_SIMILAR）自成新回合，replacePreviousInTurn=false 追加新卡，不覆盖上一回合结果"
    refused_search_guard: "LLM 拒绝措辞回退直搜前须先查本回合是否已出卡；已出卡则跳过回退（避免重复卡片）"
    empty_result: "空结果不出卡（回退路径改为插入 agent 文本消息）"
    concurrency: "Android 用 mutex 串行化；iOS 单 actor 天然满足，无需额外锁"
    ios_note: "iOS 内存态实现须为原位替换（禁 remove+append 把卡移到回合底部）；以图搜图引擎 iOS 未落地，追加分支随引擎落地补齐"

# ============================================================================
# 9.1 交互模型（Interaction Model）
# ============================================================================
interaction_model:
  # 消息列表是 flat（无日期分隔/无对话分组），按时间顺序排列
  message_list_structure: flat_chronological

  # 多会话模型（侧栏 §2.5）
  session_model:
    storage: "会话索引 + 每会话消息记录；会话 ID = UUID，内建 default 会话"
    new_session: "标题初始 'New Chat'（本地化），创建即切换"
    auto_title: "首条用户消息生成标题：去首尾标点、换行/连续空白折叠为单空格、>20 字符截断追加 …；仅当标题仍为默认值（空/'New Chat'/'Chat'）时覆盖，用户重命名后不覆盖"
    thread_preview: "取该会话最后一条消息内容（超长截断）"
    current_session_persist: "当前会话 ID 持久化；冷启恢复时校验会话仍存在，已删除则回退 default"
    delete_session: "删除会话消息 + 会话记录 + 该会话 LLM 记忆；删除当前会话回退 default"
    llm_memory_isolation: "LLM 多轮上下文按 sessionId 分键隔离（koog_memory_<sessionId>），切会话即切上下文"

  # 发送消息流程
  send_flow:
    1_type_input: "send button appears only when text non-blank && !isProcessing"
    2_press_send: "user message immediately appears in list"
    3_thinking_state:
      duration: "before first token"
      visual: "agent placeholder bubble with ThinkingIndicator (3 dots)"
      text: empty
    4_streaming_state:
      trigger: "first TextSnapshot event"
      visual: "text appears incrementally + BlinkCursor '>' at bottom"
      markdown_rendering: "live (MarkdownText during streaming)"
    5_tool_calling_state:
      trigger: "ToolCallStarted event"
      visual: "bubble text replaced with '正在调用工具…', cursor hidden"
      recovery: "next TextSnapshot restarts from empty"
    6_complete:
      action: "streaming placeholder discarded, final text saved as new AGENT_TEXT message"

  # 消息类型渲染分发
  message_type_rendering:
    USER_TEXT: "right bubble, userBubbleBg bg, userBubbleOn text"
    AGENT_TEXT: "left bubble, surfaceVariant bg, segmented Markdown (text+table+code)"
    MEDIA_RESULTS: "⚠️ separate full-width message (MediaResultsCarousel), NOT inline in text bubble"
    CHART: "separate full-width message (SVG card)"
    OPTIMIZE_CANDIDATES: "separate full-width message (GachaCandidateStrip §17)，伴随 agent 文本气泡（content=场景解释句）"
    error: "⚠️ 同 agent 正常气泡（无特殊错误色），content='推理出错：...'"

  # 媒体结果：独立消息项
  media_results_as_separate_message: true  # 不嵌入文本气泡

  # 长按 = 复制（无右键菜单）
  long_press: copy_to_clipboard
  tap_text_bubble: none  # 文本气泡无点击动作

  # 空状态示例 chips：点击直接发送，不填充输入框
  example_chip_tap: send_directly  # 不是 fill_input

  # 输入栏交互
  input_bar_behavior:
    send_button_visibility: "show only when hasContent && !isProcessing"
    processing_state: "send button hidden (NOT replaced with stop). Input field stays editable."
    stop_button: none  # ⚠️ Android 无 stop/abort 按钮（设计决策）
    model_capsule: removed_2026_08_22  # 已删除：输入区不再有模型切换胶囊
    gallery_capsule: "opens photo picker (disabled during processing)"
    voice_button: "switches to push-to-talk voice mode（2026-08-19：默认隐藏，voice_mode != disabled 且 ASR 模型已下载就绪时显示；语音模型未下载且无内容时右侧显示禁用态发送按钮替代；语音输入态整体受同一开关门控，开关关闭时已记忆的 voice 输入态回落 text）"

  # 顶部栏操作
  top_bar_actions:
    left: [back, sidebar_toggle]       # sidebar_toggle = 打开会话历史侧栏（§2.5）
    right: [report_issue, new_chat, clear_chat]  # new_chat = 新建会话（非清空）；clear_chat = 清当前会话

