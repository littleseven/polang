# ============================================================================
# 相册网格屏完整产品规格书（Gallery Grid Screen — Full Spec）
# ============================================================================
#
# 基准端：Android GalleryScreen.kt / MediaGrid.kt / MediaPager.kt（master）
# 用途：iOS 重做的唯一输入——不读 Android 源码，照此文件写代码
# 值引用：尺寸/颜色引用 design-tokens.json 的 token 名（括号内为 dp/sp 速查）
# 图标：Material Icon 名称 → iOS 实现时映射到语义最接近的 SF Symbol
#
# 红线规则（来自 gap analysis 根因总结）：
#   R1. 禁止使用系统默认 NavigationStack / TabView / List
#       —— 顶栏必须自建 48dp AppTopBar，底部必须自建 FloatingBottomTab
#   R2. 大图页打开/关闭用 scaleIn/scaleOut 转场，不用 NavigationLink push
#   R3. 缩略图必须 faceAwareVerticalAlignment——否则人像"砍头杀"
#   R4. 网格列数必须 Adaptive(minimum: 110dp)，不固定列数
#   R5. 所有 🔴 gap analysis 项必须在本 spec 中有对应描述

# ============================================================================
# 第一部分：网格页（Grid Page）
# ============================================================================

grid_page:

  # ── 1. 总体结构 ──────────────────────────────────────────────
  #
  # 整体是一个全屏 ZStack：
  #   - 底层 background(colorScheme.background)
  #   - VStack 内容层（顶栏 → 扫描进度条 → 网格区）
  #   - 浮层 FloatingBottomTab（ZStack overlay，bottom 对齐）
  #   - 浮层 MediaPager（条件，scale 转场覆盖全屏）
  #
  # 🔴 R1：不使用 NavigationStack。顶栏自建，自己处理 safe area 顶部避让。

  structure:
    type: full_screen_zstack
    background: colorScheme.background
    layers:
      - layer: content_vstack
        children: [top_bar, scan_progress, grid_or_placeholder]
      - layer: floating_bottom_tab
        anchor: bottom_center
        z_above_content: true
      - layer: media_pager_overlay
        visible_when: media_pager_open
        z_top: true

  # ── 2. 系统栏 ────────────────────────────────────────────────

  status_bar:
    visible: true
    content_color: follows_theme            # 浅色主题 dark 图标 / 深色主题 light 图标

  home_indicator:
    defer_gestures: false                   # 相册页不 defer，正常 home 手势

  # ── 3. Back 栈优先级链 ───────────────────────────────────────
  # 系统返回键 / iOS 边缘右划，按此链匹配第一个命中项执行。

  back_stack:
    - when: search_active
      action: clear_search_and_close_search_bar
    - when: selection_mode
      action: exit_selection_mode
    - when: media_pager_open
      action: close_media_pager_with_scale_out
    - when: sort_menu_expanded
      action: dismiss_sort_menu
    - default: leave_gallery                # 回到上屏或 Tab

  # ── 4. 顶栏 AppTopBar ────────────────────────────────────────
  # 🔴 R1：自建，不用 NavigationStack 大标题。

  top_bar:
    # 几何 SSOT → docs/08-UI-SPECS/screens/topbar.yaml 变体 B（variant_home）；本节仅保留相册页专属行为
    type: AppTopBar                         # 自建组件
    background: colorScheme.surface
    anchor: safe_area_top                   # 自动避让状态栏
    layout: row_space_between               # 左标题 / 右操作组 HStack

    # ── 标题 ──
    title:
      text: "相册"
      position: leading

    # ── 操作组 ──
    actions:
      items:
        # (a) 模型中心
        - id: model_center
          material_icon: smart_toy
          sf_symbol: "cpu"                  # 或 "sparkles"
          tint: colorScheme.onSurface
          behavior: navigate_to_model_center

        # (b) TAG 扫描开关
        - id: scan_toggle
          material_icon: radar
          sf_symbol: "antenna.radiowaves.left.and.right"
          tint: colorScheme.onSurface
          behavior: toggle_tag_scanning     # 开始扫描→显示进度条；暂停→隐藏
          note: "图标可随状态切换：扫描中显示 stop/pause 图标"

        # (c) 搜索入口
        - id: search
          material_icon: search
          sf_symbol: "magnifyingglass"
          tint: colorScheme.onSurface
          behavior: activate_search_mode    # → 顶栏切换为 SearchTopBar

        # (d) 分组模式菜单
        - id: sort_menu
          material_icon: sort
          sf_symbol: "arrow.up.arrow.down"
          tint: colorScheme.onSurface
          behavior: show_dropdown_menu
          menu:
            type: dropdown_overlay          # 下拉浮层，不弹 Dialog
            options:
              - DATE:      "按日期分组"
              - FACE:      "按人脸分组"
              - PERSON:    "按人物分组"
              - LANDSCAPE: "按风景分组"
              - LOCATION:  "按位置分组"
              - NONE:      "不分组"
            current_selection_checkmark: true
            on_select: set_grouping_mode($option)

        # (e) 设置
        - id: settings
          material_icon: settings
          sf_symbol: "gearshape"
          tint: colorScheme.onSurface
          behavior: navigate_to_settings

  # ── 5. 搜索激活态顶栏 SearchTopBar ───────────────────────────
  # 🔴 gap #13：iOS 完全缺失搜索功能（/ios-follow gallery-search 2026-08-11 实现后关闭）。
  # 契约来源：Android SearchTopBar.kt + SearchField.kt 定稿反向提取（2026-08-11 校正漂移：
  # placeholder/结果计数格式与位置以代码为准）。

  search_top_bar:
    # 几何 SSOT → docs/08-UI-SPECS/screens/topbar.yaml 变体 C（variant_search）；本节仅保留相册搜索专属行为
    visible_when: search_active
    type: SearchTopBar                      # 替换普通 AppTopBar
    background: colorScheme.surface
    layout:
      leading:
        icon: arrow_back                    # 返回，material: ArrowBack / SF: "chevron.left"
        behavior: clear_search_and_close    # = back_stack search_active 分支
      center:
        type: search_field                  # 通用组件 SearchField（圆角胶囊，Chat/Gallery 共用）
        string_key_placeholder: gallery_search_hint
        placeholder: "按内容、地点、文字搜索…"   # EN "Search by content, location, text…" / zh-TW "按內容、地點、文字搜尋…"
        font_size: searchField.fontSize     # 14sp
        text_color: colorScheme.onSurface
        cursor_color: colorScheme.primary
        background: "colorScheme.surfaceVariant @ alpha 0.7"
        corner_radius: searchField.cornerRadius   # 24dp 胶囊
        padding_h: searchField.paddingH     # 12dp
        padding_v: searchField.paddingV     # 8dp
        leading_icon:
          material_icon: search             # SF: "magnifyingglass"
          tint: "colorScheme.onSurface @ alpha 0.5"
          gap_after: searchField.iconGap    # 8dp
        clear_button:
          visible_when: query_not_empty
          material_icon: clear              # SF: "xmark"
          button_size: searchField.clearButtonSize   # 20dp
          icon_size: searchField.clearIconSize       # 16dp
          tint: "colorScheme.onSurface @ alpha 0.5"
          string_key_cd: cd_clear_search
          behavior: clear_query             # 仅清空输入，不退出搜索态
        placeholder_color: "colorScheme.onSurface @ alpha 0.4"
        debounce_ms: motion.searchDebounceMs   # 300（snapshotFlow + debounce）
        autofocus: true
        single_line: true
        accessibility_id: search_field      # Android contentDescription="搜索框"
      trailing:
        result_count:
          visible_when: search_finished     # resultCount==null（未搜索过）时不渲染
          string_key: people_photos_count   # EN "%1$d photos" / zh-CN "%1$d 张" / zh-TW "%1$d 張"
          position: inline_trailing         # 内嵌顶栏右侧（非网格上方独立行）
          font_size: searchField.resultCountFontSize   # 12sp
          color: "colorScheme.onSurface @ alpha 0.6"
          gap_before: searchField.resultCountGap       # 8dp

  # ── 6. TAG 扫描进度条 ────────────────────────────────────────
  # 🔴 gap #14：iOS 完全缺失。

  scan_progress:
    visible_when: tag_scanning_active
    type: linear_progress_indicator
    anchor: below_top_bar
    height: 2                               # 固定 2dp
    width: full_width
    color: colorScheme.primary
    track_color: colorScheme.surfaceVariant
    behavior: indeterminate_or_determinate  # 有进度值则 determinate，否则 indeterminate

  # ── 7. 网格区 ────────────────────────────────────────────────

  grid:
    type: lazy_vertical_grid
    fill: remaining_space                   # 填满顶栏以下到底栏以上的剩余空间
    background: colorScheme.background

    # ── 列策略 ──
    # 🔴 R4 / gap #1：必须自适应，不固定列数。
    columns:
      strategy: adaptive
      minimum_cell_width: grid.minCellSize  # 110dp → iOS GridItem(.adaptive(minimum: 110))
      # 大屏自动多列（如 iPad 可能 6+ 列），小屏 3 列，不硬编码

    # ── 间距 ──
    spacing:
      horizontal: grid.spacing             # 2dp
      vertical: grid.spacing               # 2dp
    content_padding:
      all: grid.spacing                     # 2dp 四周

    # ── 分组头 MediaGroupHeader ──
    # 🔴 gap #8/#45：iOS 纯文本无计数、无颜色区分，必须补齐。
    group_header:
      type: MediaGroupHeader
      span: full_width                      # 跨满所有列
      sticky: true                          # 随滚动吸附顶部

      title:
        text_source: group_label            # 如"今天"/"昨天"/"2026年8月"
        font: titleMedium                   # ≈ iOS .title3 / 16sp
        weight: bold
        color: colorScheme.primary          # 🔴 不是默认色，是 primary

      count:
        format: "({count})"                 # 如 "(42)"
        font: bodyMedium                    # ≈ iOS .body / 14sp
        color: colorScheme.secondary

      padding:
        horizontal: spacing.lg              # 16dp
        vertical: spacing.sm                # 8dp
      background: colorScheme.background    # 不透明，确保 sticky 遮挡下方内容
      tappable: false                       # 整行不可点击（仅展示信息）

    # ── 缩略图项 ThumbnailItem ──
    # 🔴 gap #5：faceAwareVerticalAlignment 是 P0-3，砍头杀根因。
    thumbnail_item:
      type: ThumbnailItem
      shape:
        aspect_ratio: "1:1"                 # 正方形
        corner_radius: grid.cornerRadius    # 2dp → 🔴 gap #4：必须圆角，不能直角
      content_scale: crop                   # 填满裁切
      placeholder_color: colorScheme.surface  # 加载前底色，防深色闪烁

      # ── 人脸感知纵向对齐 ──
      # 🔴 R3 / P0-3：这是最关键的对齐项。
      # 每张人像照片在裁切时，不应默认从顶部裁，而应根据人脸关键点的 Y 坐标
      # （faceFocusY ∈ [0,1]，来自端侧人脸检测）调整纵向偏移，确保脸部完整可见。
      face_aware_vertical_alignment:
        priority: P0                        # 🔴 最高优先级
        input: faceFocusY                   # float [0,1]，0=顶 1=底
        behavior: |
          当 faceFocusY 存在时：不默认居中裁切，而是把「人脸中心」对齐到
          「cell 中心向上偏移 1/6·cell 高」处，并 clamp 到合法裁切范围。
          精确公式（cell=裁切框尺寸，img=aspectFill 后渲染尺寸；纵向溢出时 imgH>cellH）：
            topY = cellH/2 − (1/6)·cellH − faceFocusY·imgH
            topY = clamp(topY, cellH − imgH, 0)   # 仅纵向溢出维度；横向始终居中
          语义：faceFocusY 小（脸靠顶）→ topY 趋 0（少裁顶，护头顶）；
                faceFocusY 大（脸靠底）→ topY 趋下界（图片上移，把底脸拉上来）。
          自验向量（竖图 2:3 进 1:1 cell：cell=100，imgH=150，clamp[−50,0]）：
            faceFocusY=0.5 → topY=−42；0.2 → 0（顶脸不裁头）；0.9 → −50（底脸上移到极限）。
          SSOT：Android `core/image/FaceAwareAlignment.kt`（biasUp=1/6）。
        fallback: center_crop               # faceFocusY==null（无人脸/未扫描/视频）退回居中裁切
        data_source_platform_parity:        # 本管线契约层新增台账（砍头杀根因：数据未流到）
          android: "MediaAsset.faceFocusY 由 Room 持久化、tag 生成回填（migration 17→18）；相册网格直接读 asset.faceFocusY。"
          ios: "PHAsset 不携带人脸数据；faceFocusY 存独立 TagDatabase（Pass1 扫描写 media_assets.faceFocusY）。相册 MediaAsset 从 PHAsset 构造时不带 faceFocusY → 必须额外批量读 (uri→faceFocusY) 注入网格渲染（GalleryViewModel.faceFocusYMap），否则 asset.faceFocusY 恒 nil → 居中裁切 → 砍头杀。"

      # ── 视频标记 ──
      # 🔴 gap #6：iOS 完全缺失。
      video_indicator:
        visible_when: is_video
        material_icon: play_circle          # PlayCircle
        sf_symbol: "play.circle.fill"
        size: icon.xl                       # 32dp
        color: white_alpha_80               # 白色 80% 不透明
        anchor: center                      # 居中于缩略图
        shadow: true                        # 增强可读性

      # ── 选择态 ──
      # 🔴 gap #7：iOS 完全缺失选择模式。
      selection_state:
        trigger: long_press                 # 长按缩略图进入选择模式
        overlay:
          color: black_alpha_30             # 黑色 30% 不透明遮罩
          covers: full_thumbnail
        checkbox:
          material_icon_selected: check_circle
          material_icon_unselected: radio_button_unchecked
          sf_symbol_selected: "checkmark.circle.fill"
          sf_symbol_unselected: "circle"
          size: icon.lg                     # 24dp
          color: colorScheme.primary        # 选中时 primary 色
          anchor: top_end                   # 右上角
          padding: 4dp                      # 距缩略图边缘
        drag_multi_select:
          enabled: true                     # 🔴 gap P1-3：拖拽多选
          behavior: |
            进入选择模式后，手指不抬起继续滑动，经过的缩略图自动切换选中态。
            用于快速选择连续多张照片。
        # 选择模式下的底部操作栏（替换 FloatingBottomTab）
        selection_bottom_bar:
          visible_when: selection_mode
          actions: [share, delete, select_all, cancel]

  # ── 8. 冷启动占位页 GallerySplashPlaceholder ──
  # 🔴 gap #39/#40 / P0-4：iOS 完全缺失，数据加载时直接空网格闪烁。

  splash_placeholder:
    visible_when: loading_and_media_not_loaded_yet
    type: GallerySplashPlaceholder
    anchor: full_screen_center

    content:
      type: quote_display
      quote:
        text_font: serif_italic             # 衬线体 + 斜体
        text_size: 20                       # 20sp → iOS .system(size: 20, design: .serif).italic()
        color: colorScheme.onBackground
        text_source: quotes_pool            # 名人名言池
        locale_aware: true                  # 按 locale 取对应语言的名言
      author:
        text_font: serif
        text_size: 16                       # subheadline
        color: colorScheme.secondary
        format: "— {author}"
        below_quote: true
        spacing_above: spacing.sm           # 8dp

    # 🔴 P0-4：顶部 28% 高度留白（名言不是垂直居中，而是偏下）
    top_padding_ratio: 0.28                 # = screenHeight × 28%

    persistence:
      note: |
        iOS 用 @State 天然稳定，无需 rememberSaveable 等价。
        关键是不让占位页在每次数据刷新时闪烁重建——
        应在 mediaList 首次非空后才永久切换到网格。

  # ── 9. 空态 EmptyGalleryMessage ──
  # 🔴 gap #41 / P1-8：有权限但无媒体文件时必须显示提示。
  # ⚠️ 2026-08-16 spec 漂移修正：Android 定稿实际复用 GallerySplashPlaceholder（格言占位，
  # GalleryScreen.kt:765-767），非纯文本 EmptyGalleryMessage——以代码为准反向修正。

  empty_gallery:
    visible_when: permission_granted_and_media_list_empty
    type: GallerySplashPlaceholder        # 与 splash_placeholder 同组件（quote_display 格言池）
    reuse: splash_placeholder             # 布局/字体/留白全部同 §splash_placeholder（top_padding_ratio 0.28 等）
    fallback_text: "未找到任何媒体文件"    # 仅格言池不可用时兜底

  # ── 10. 搜索无结果态 ──
  # 🔴 gap #42：搜索结果为空时必须显示提示。
  # ⚠️ Android 现网为空态文案 Kotlin 硬编码中文（技术债，contracts.md §14 R7）；
  # iOS 必须走 xcstrings 五语，key=gallery_search_no_result_with_query。

  search_no_result:
    visible_when: search_active_and_result_empty
    type: EmptyGalleryMessage
    anchor: full_screen_center
    content:
      text: '未找到匹配 "{query}" 的照片'
      i18n:
        en: 'No photos matching "{query}"'
        zh-Hans: '未找到匹配 "{query}" 的照片'
        zh-Hant: '未找到符合「{query}」的照片'
      font: bodyLarge
      color: colorScheme.secondary

  # ── 10b. 搜索结果态 ──
  # 结果非空时：网格替换为搜索结果，复用主网格全部能力（选择/删除/分享/预览/faceAware 对齐）。

  search_results:
    visible_when: search_active_and_result_not_empty
    group_header:
      title_format: '搜索 "{query}"（{count} 张）'   # GroupTitleType.SEARCH 渲染规则（Android GalleryUtils 硬编码中文，技术债 R7，iOS 进 xcstrings）
      i18n:
        en: 'Search "{query}" ({count} photos)'
        zh-Hans: '搜索 "{query}"（{count} 张）'
        zh-Hant: '搜尋 "{query}"（{count} 張）'
      trailing_count: '({count})'             # 与主网格分组头一致的右侧计数样式
    grid: same_as_main_grid                 # 同一 MediaGrid：adaptive 列/2dp 间距/2dp 圆角/faceAwareVerticalAlignment
    interactions: inherit_main_grid         # 点按预览、长按多选、删除/分享与主网格一致
    loading:
      visible_when: search_in_flight_and_no_results_yet   # 首次搜索（无旧结果）→ 全屏 Loading
      type: circular_progress_center
      note: "已有结果时再次搜索不显示 Loading，保持旧结果直到新结果返回（防闪烁）"

  # ── 11. 权限态 UI ──
  # 🔴 gap #35/#38：iOS 权限拒绝/未决定态无图标无标题。

  permission_states:

    granted:
      grid_visible: true

    denied_or_not_determined:
      # 有权限但拒绝 / 从未请求过 → 显示授权引导页
      type: GalleryPermissionMessage
      anchor: full_screen_center
      icon:
        material_icon: photo_library
        sf_symbol: "photo.on.rectangle"
        size: 64                            # 64dp
        color: colorScheme.primary
        anchor: above_title
        spacing_below: spacing.lg           # 16dp
      title:
        text: "需要相册权限"
        font: headlineSmall                 # ≈ iOS .headline / 24sp
        color: colorScheme.onBackground
      message:
        text: "允许访问以浏览和管理你的照片和视频"
        font: bodyMedium                    # 14sp
        color: colorScheme.secondary
        spacing_above: spacing.sm           # 8dp
      button:
        text: "授予权限"
        font: labelLarge
        background: colorScheme.primary
        foreground: colorScheme.onPrimary
        behavior: request_permission
        spacing_above: spacing.lg           # 16dp
      padding:
        horizontal: spacing.xxl             # 32dp → 🔴 gap analysis 要求 32dp

    limited_ios_only:
      # iOS 独有：Limited Access 模式
      # 合理的平台差异，不影响对齐
      behavior: show_grid_with_manage_banner
      banner_text: "管理可访问的照片"
      note: "iOS Limited Access — Android 用 Photo Picker 范式替代，此处允许平台原生差异"

  # ── 12. 悬浮底部 Tab FloatingBottomTab ──
  # 🔴 gap #12/#47 / P2-1：iOS 用系统 TabView，必须改为自建悬浮胶囊。

  floating_bottom_tab:
    type: FloatingBottomTab
    anchor: bottom_center
    z_above_content: true
    margin_bottom: spacing.lg               # 16dp 距屏底

    shape:
      type: capsule                         # 胶囊形
      corner_radius: 28                     # 28dp
      background: colorScheme.surface
      tonal_elevation: 3                    # dp，Material tonal 层级
      shadow_elevation: 6                   # dp，投影深度

    items:
      # 2026-09-06 主导航统一（d301f0554）：底 bar 五项与主页面 Pager 1:1——
      # 相册(0)/整理(1)/聊天(2)/人物(3)/回忆(4)，点击瞬时切页；打标图标已移除
      # （TAG 扫描并入整理页 SCAN tab）。早前 2026-08-26 的四项版（含 tag_tab）作废。
      # iOS 图标资产 mat_o_photo_library / mat_o_cleaning_services 由 ios-follow
      # main-nav-memories 批次引入（分支 feat/ios-follow-batch-20260915）。
      - id: gallery_tab
        material_icon: photo_library
        ios_asset: "mat_o_photo_library"
        size: icon.lg                       # 24dp
        behavior: switch_main_page          # 切 Pager 页 0（相册）
      - id: cleanup_tab
        material_icon: cleaning_services
        ios_asset: "mat_o_cleaning_services"
        size: icon.lg
        behavior: switch_main_page          # 切 Pager 页 1（整理：去重 2.0 hub / 扫描）
      - id: chat_tab
        material_icon: chat_bubble
        ios_asset: "mat_o_chat_bubble"
        size: icon.lg
        behavior: switch_main_page          # 切 Pager 页 2（聊天）
      - id: people_tab
        material_icon: account_circle
        ios_asset: "mat_o_account_circle"
        size: icon.lg
        behavior: switch_main_page          # 切 Pager 页 3（人物）
      - id: memories_tab
        material_icon: auto_awesome
        ios_asset: "mat_o_auto_awesome"
        size: icon.lg
        behavior: switch_main_page          # 切 Pager 页 4（回忆）

# ============================================================================
# 第二部分：大图页（Media Pager / 详情页）
# ============================================================================
# 🔴 gap analysis 显示 iOS 大图页几乎全空：
#    无顶栏、无底栏、无缩放、无信息弹窗、无视频播放、无 OCR/Vision 叠层。
#    以下为完整规格，所有项均为 P0 或 P1。

media_pager:

  # ── 13. 打开转场 ──
  # 🔴 gap #15 / P2-2：iOS 用系统 push，必须改为 scale 转场。
  open_transition:
    type: scale_in
    initial_scale: 0.2                      # 从缩略图大小开始
    final_scale: 1.0                        # 放大到全屏
    transform_origin: thumbnail_rect        # 从被点击缩略图的屏幕坐标展开
    accompanying: fade_in
    duration_ms: 300
    note: |
      🔴 禁止使用 NavigationLink push（左滑入）。
      iOS 可用 matchedGeometryEffect 或自定义 transition + offset 实现。

  # ── 14. 关闭转场 ──
  # 🔴 gap #16：必须原路缩回。
  close_transition:
    type: scale_out
    initial_scale: 1.0
    final_scale: 0.2
    transform_origin: original_thumbnail_position
    accompanying: fade_out
    duration_ms: 250
    trigger: back_button_or_swipe_down      # 返回键 / 向下滑动手势

  # ── 15. 图片区域 ──
  # gap #17：此部分 iOS 已对齐。
  image_area:
    type: paged_horizontal_gallery          # 水平翻页
    background: black                       # 纯黑底
    content_scale: fit                      # 等比缩放完整显示（不裁切）
    fill: full_screen
    page_spacing: pager.pageSpacing         # 16dp → 🔴 gap #18：iOS 无页间距，必须加
    paging_gesture: swipe_horizontal        # 左右滑动翻页

  # ── 16. 缩放手势 ZoomableImage ──
  # 🔴 gap #19 / P0-2：iOS 完全缺失缩放。
  zoomable_image:
    priority: P0
    pinch_zoom:
      min_scale: 1.0
      max_scale: 4.0                        # 双指缩放 1–4x
      behavior: |
        双指捏合放大/缩小。缩放时禁用横滑翻页（避免缩放和翻页冲突）。
        松手后若 scale < 1.0 自动回弹到 1.0。
    pan:
      enabled_when: current_scale > 1.0
      behavior: |
        放大状态下单指拖动平移。拖动有边界 clamp——
        不会拖出图片边界留下空白。
    double_tap:
      behavior: toggle_zoom                 # 双击在 1x ↔ 2.5x 之间切换
    gesture_conflict_handling: |
      缩放/平移手势激活时，拦截横向翻页手势；
      回到 1.0 scale 后恢复翻页。

  # ── 16b. 上滑删除手势（回收站，2026-09-08）──
  # 与「滑动整理」（SwipeReview）↑删除 同一手势语言；iOS 待跟随（platform difference）。
  swipe_up_delete:
    gesture: swipe_up                      # 向上拖动跟手上移（只跟向上，向下钳制不跟手）
    available_when:                        # 全部满足才响应，否则行为与无手势一致
      - callback_attached                  # 宿主传入 onSwipeUpDelete（三宿主均传：相册/Chat 搜图/回忆详情）
      - not_zoomed                         # 放大态（scale > 1.02）不响应
      - is_photo                           # 仅照片页（与底栏删除按钮可见条件一致；视频不响应）
      - vertical_dominant                  # 竖直位移主导（abs(dy) > abs(dx)）才 consume，不抢横向翻页
    threshold: page_height * 0.25          # 松手结算阈值 = 页高 25%（同 SwipeReview SWIPE_THRESHOLD_FRACTION）
    feedback:
      hint_overlay:                        # 拖动中图片上方浮现胶囊提示
        icon: delete
        text_key: preview_swipe_delete_hint   # 「松开移入回收站 / Release to move to Trash」五语
        text_key_legacy: preview_delete_hint  # API<30 降级永久删除时改用中性「松开删除 / Release to delete」
        armed_style: error_color_highlight    # 超阈值后胶囊变为 error 色高亮
        suppressed_when: ocr_or_vision_overlay_visible  # OCR/Vision 浮层可见时手势不响应
      commit_animation: fly_up_and_fade_out   # 超阈值：向上飞出屏外 + 淡出 220ms 后回调
      cancel_animation: spring_back           # 未超阈值/授权取消：弹回原位
    delete_path:
      api_30_plus: system_trash            # MediaStore.createTrashRequest 系统回收站，30 天可恢复
      silent_when: manage_media_granted_and_toggle_on  # 设置页「删除不再询问」开关开 + 持 MANAGE_MEDIA
                                           # （API 31+，MediaStore.canManageMedia）时直写 IS_TRASHED 单列
                                           # 静默回收（零系统弹框，不产生 pendingRequest）；开关关/无权限回落上行系统授权框；
                                           # 直写失败子集回落 token 通路（持权时免弹框自动通过，2026-09-12）
      api_below_30: legacy_delete_fallback # 降级走既有永久删除 + 系统授权框通路（PreviewTrashRouting 分流）
      auth_ui: TrashAuthEffects            # 共享授权拉起组件（StartIntentSenderForResult + tag 分桶路由）
      list_shrink: on_trashed_outcome_only # 🔴 只在授权成功（Trashed outcome）后收缩预览列表；
                                           # 授权取消/失败用户仍停在原图；删空自动收起预览
    ios_note: |
      iOS 待跟随：PhotoLibrary PUA 或自实现回收站（30 天可恢复语义需保留）；
      手势阈值/飞出时长/提示文案口径以本节为准。
      实现校正（2026-09-15）：`PHAssetChangeRequest.deleteAssets` 系统强制弹确认框
      （"Delete Photo?"），iOS 无零弹框通路；静默删除开关在 iOS 不适用（见 §26 台账）。
      宿主覆盖（2026-09-16）：本批仅相册大图页（MediaPagerView）接入；Chat 搜图预览与
      回忆详情两宿主缺整层预览，随宿主层落地接入同一手势组件。

  # ── 16c. 网格 trashed 过滤与乐观移除（2026-09-15 补节，Android f249da1e2 + 4ed758d55）──
  grid_trashed_filter:
    problem: "Android HyperOS MediaStore 普查不过滤 trashed 行 → 已回收照片残留网格"
    android_actual:
      query_filter: "MediaStore 查询侧加 IS_TRASHED=0 过滤（API 29+），stale 探活显式读 IS_TRASHED 列（MediaRepositoryImpl.notTrashedSelection）"
      optimistic_removal: "上滑删除成功后 Room+内存双层缓存乐观移除并重发射（removeTrashedFromLocalCache），全量重扫兜底"
    shared_contract: "MediaRepository.removeTrashedFromLocalCache(uris)（commonMain）；iOS actual 为空操作（PHPhotoLibraryObserver 即时驱动刷新，契约允许）"
    ios_note: "iOS 天然免疫：PHFetchResult 默认不含 Recently Deleted 资产；本小节对 iOS 无实现任务，仅登记契约"

  # ── 17. 顶栏（动画显隐）──
  # 🔴 gap #21 / P0-1：iOS 无顶栏，无法返回。
  top_controls:
    priority: P0
    visible_default: true
    toggle: tap_on_image                   # 单击图片切换显隐
    animation: slide_and_fade               # 上下滑入/滑出 + 淡入/淡出
    background: black_alpha_85              # 黑色 85% 不透明半透明栏
    anchor: top                             # 顶部对齐 safe area

    layout: row_space_between

    # ── 左侧 ──
    left_group:
      items:
        - id: back
          material_icon: arrow_back
          sf_symbol: "chevron.left"
          size: pager.actionIconSize        # 32dp
          color: white
          behavior: close_media_pager       # 触发 close_transition
        - id: date_label
          text_source: media_date_formatted # 如"2026年8月8日"
          font: bodyMedium
          color: white
          spacing_leading: spacing.sm       # 8dp

    # ── 右侧 ──
    right_group:
      spacing: spacing.md                   # 12dp
      items:
        - id: info
          material_icon: info
          sf_symbol: "info.circle"
          size: pager.actionIconSize        # 32dp
          color: white
          behavior: show_photo_info_dialog  # → 见 photo_info_dialog
        - id: more_menu
          material_icon: more_vert
          sf_symbol: "ellipsis"
          size: pager.actionIconSize        # 32dp
          color: white
          behavior: show_more_menu
          menu:
            options:
              - image_understanding: "图像理解"   # → VisionResultOverlay
              - ocr: "文字识别 (OCR)"              # → OcrResultOverlay
              - face_landmarks: "人脸关键点"       # → FaceLandmarkCanvasOverlay (debug)

  # ── 18. 底栏（动画显隐）──
  # 🔴 gap #22 / P0-1：iOS 无底栏，无法分享/编辑/删除。
  bottom_bar:
    priority: P0
    visible_default: true
    toggle: same_as_top_controls            # 与顶栏同步显隐
    animation: slide_and_fade
    background: black_alpha_85
    anchor: bottom                          # 底部对齐 safe area

    layout: row_evenly_spaced               # 均匀分布
    slot_width: min 48dp, hug label         # 2026-08-23 EN 修复：槽位宽度不锁死，label 单行完整显示
                                             # （id_photo EN 曾缩成 "ID" 短文案致语义缺失，已废弃改全文案）
    container: none                         # 🔴 按钮禁用形状容器：M3 IconButton 圆形 Surface 会把长文案
                                             # 两端切弧（EN "ID Photo" 字尾被圆弧吃掉，真机实证）——
                                             # 裸 Column 直排 + clickable，48dp 触控目标由 defaultMinSize 保
    visible_when: is_photo                  # 仅照片显示底栏（视频见 video_player）

    items:
      - id: share
        material_icon: send
        sf_symbol: "paperplane.fill"
        size: icon.xl                       # 32dp
        label: "发送"
        label_font: bodySmall
        label_color: white
        behavior: share_media
      - id: edit
        material_icon: edit
        sf_symbol: "slider.horizontal.3"    # 或 "wand.and.stars"
        size: icon.xl
        label: "编辑"
        label_font: bodySmall
        label_color: white
        behavior: open_photo_editor
      - id: id_photo
        material_icon: badge
        sf_symbol: "person.crop.square"
        size: icon.xl
        label: "证件照"
        label_font: bodySmall
        label_color: white
        behavior: open_id_photo_mode
      - id: delete
        material_icon: delete
        sf_symbol: "trash"
        size: icon.xl
        label: "删除"
        label_font: bodySmall
        label_color: white
        behavior: delete_media_with_confirm

  # ── 19. 长按手势 ──
  # 🔴 gap #24：iOS 缺失。
  long_press:
    behavior: open_photo_editor_and_haptic_feedback
    haptic: light_impact                    # 触觉反馈

  # ── 20. 照片信息弹窗 PhotoInfoDialog ──
  # 🔴 gap #25 / P1-4：iOS 完全缺失。
  photo_info_dialog:
    priority: P1
    trigger: info_button_tap                # 顶栏 info 图标
    type: bottom_sheet_or_dialog            # iOS: bottom sheet / Android: Dialog
    max_width: pager.overlayMaxWidth        # 393dp（2026-08-19 iPhone 15 画布宽）
    max_height: pager.overlayMaxHeight      # 500dp

    fields:
      - field: file_name
        label: "文件名"
        value_source: media_file_name
      - field: type
        label: "类型"
        value_source: media_mime_type       # 如 "JPEG" / "MP4"
      - field: date
        label: "日期"
        value_source: media_date_full       # 完整时间戳
      - field: duration
        label: "时长"
        value_source: media_duration        # 仅视频，格式 "00:32"
        visible_when: is_video
      - field: source
        label: "来源"
        value_source: media_source          # 如 "相机拍摄" / "截图"
      - field: location
        label: "位置"
        value_source: media_location_text   # 如 "北京市朝阳区"
        tappable: true                      # 🔴 可点击跳转地图
        behavior: open_map_app
      - field: aesthetic_score
        label: "美学评分"
        value_source: media_aesthetic_score # 如 "7.2 / 10"
      - field: face_info
        label: "人脸信息"
        value_source: media_face_details    # 检测到的人脸数量与属性
      - field: tags
        label: "标签"
        type: flow_row                      # 🔴 FlowRow 标签流式布局
        value_source: media_tag_list        # 如 ["风景", "日落", "海边"]
      - field: ocr_text
        label: "OCR 文本"
        value_source: media_ocr_text        # 识别到的文字内容

  # ── 21. OCR 结果叠层 OcrResultOverlay ──
  # 🔴 gap #26：iOS 缺失。
  ocr_overlay:
    trigger: more_menu → "文字识别 (OCR)"
    type: result_overlay
    content:
      recognized_text: ocr_engine_result
      actions: [copy_text, share_text]

  # ── 22. 图像理解叠层 VisionResultOverlay ──
  # 🔴 gap #27：iOS 缺失。
  vision_overlay:
    trigger: more_menu → "图像理解"
    type: result_overlay
    content:
      description: vlm_description          # Markdown 渲染的图像描述
      render: markdown
      actions: [copy, share]

  # ── 23. 人脸关键点叠层 FaceLandmarkCanvasOverlay ──
  # 🔴 gap #28：iOS 缺失（debug 模式专用）。
  face_landmark_overlay:
    trigger: more_menu → "人脸关键点"
    type: debug_canvas_overlay
    visible_when: debug_mode_enabled
    content: face_landmark_points_drawn_on_image

  # ── 24. 视频播放 VideoPlayer ──
  # 🔴 gap #20 / P1-1：iOS 大图页无视频支持。
  video_player:
    priority: P1
    visible_when: is_video
    type: video_player_with_controls
    controls: native_player_controls        # 播放/暂停/进度条/全屏
    behavior: |
      视频项打开时自动播放或显示播放按钮。
      控制条叠加在视频上方，与顶/底栏独立显隐。
    note: "iOS 用 AVKit AVPlayerViewController 等价实现"

  # ── 25. 分页指示器 ──
  paging_indicator:
    visible: false                          # 🔴 Android 无页码点，iOS 也不应有
    note: "禁止显示系统默认 page dots（gap #30 标记为多余）"

  # ── 26. 平台差异台账（ios-follow 2026-08-11：放开全部入口）──
  # 登记 more_menu 三项 + 底栏 id_photo 的双端实际路径与隐私披露对齐。
  platform_differences:

    swipe_up_delete_silent_trash:
      android_actual: "MANAGE_MEDIA 持权 + 设置页「删除不再询问」开关开 → 直写 IS_TRASHED 静默回收（零系统弹框，API 31+）；否则 createTrashRequest 系统授权框"
      ios_actual: "PHAssetChangeRequest.deleteAssets → 系统 Recently Deleted（30 天可恢复）；系统强制确认框（Apple 无零弹框通路），故「删除不再询问」开关 iOS 不适用、不登记跟随任务"
      note: "Android 专属能力（MANAGE_MEDIA 直写为 Android Scoped Storage 产物）；2026-09-15 校正：iOS 删除必走系统确认框，原「天然静默」表述作废"

    image_understanding:
      android_actual:
        engine: "Florence-2 (`Florence2Tagger.tag().summary`) 或 local VLM `localLlmEngine.imageInference`（Qwen3-VL）"
        entrypoint: "TagGenerationScheduler.describeImage → VisionResultOverlay（Copy/Share）"
      ios_actual:
        engine: "复用既有 `Florence2Tagger.tag().summary`（同一 Florence-2-base INT8 ORT，端侧）"
        entrypoint: "TagScanOrchestrator.describeImage(_:) → VisionResultOverlay（Copy/Share）"
        language: "英文 caption（对齐 Android Florence-2 原始输出；中文翻译留后续）"
        gating: "仅 PHOTO；模型未下载/低内存(<300MB)/失败 → 失败态文案"
      privacy: "100% 端侧（图片文件不出端，合规 ADR-008）"

    ocr:
      android_actual:
        engine: "Google ML Kit 中文识别（`MlKitOcrProcessor`，端侧）"
        entrypoint: "MediaViewModel.recognizeTextFromCurrentImage → OcrResultOverlay（Copy/Share + 字数）"
      ios_actual:
        engine: "Apple Vision `VNRecognizeTextRequest`（accurate，zh-Hans/zh-Hant/en-US/en-GB，端侧）"
        entrypoint: "OcrRecognizer.recognize(_:) → OcrResultOverlay（Copy/Share + 字数）"
        gating: "仅 PHOTO；无文字 → 「未识别到文字」；失败 → 失败态文案"
        db_write: "本功能不写 TagDatabase.ocrText（仅 overlay 即时态，对齐 Android OcrResultOverlay）"
      privacy: "100% 端侧（Vision on-device，合规 ADR-008）"

    id_photo:
      android_actual:
        engine: "端侧抠图（`IDPhotoComposer` + IDPhotoSpecs）"
        entrypoint: "Screen.IDPhoto → IDPhotoScreen（背景色/证件尺寸/输出）"
      ios_actual:
        status: "DEFERRED（技术债）—— ORT 运行时已在（Florence2Tagger 已用 onnxruntime_objc），但无 matting runner、无 IDPhotoScreen"
        entrypoint: "保留诚实「敬请期待」占位（不假造交互）"
        tech_debt: "后续需新建 MODNet/U2Net ORT runner + IDPhotoScreen + IDPhotoSpecs 对齐"
      note: "ios-follow 2026-08-11 决策：推迟，本轮不实现"

    search:
      android_actual:
        engine: "MediaSearchEngine 三层混合检索（QueryParser 规则 → Room SQL 显式召回 → MobileCLIP 语义 → mergeAndRank 0.25/0.65/0.1 融合），全部在 androidApp 模块（非 shared）"
        data: "Room v19：media_assets + tags/ocr_words/location_hierarchy/face_embeddings/persons/person_relations/media_feedback 辅助表"
      ios_actual:
        engine: "Swift 全量对等实现（行为契约 tmp/ios-follow/gallery-search/contracts.md，含语义/跨语言/人物解析；QueryBuilder+SearchRanker 为 Android 死代码不移植，线上仅 mergeAndRank 一套）"
        data: "TagDatabase SQLite（表结构对齐 Room）+ 需补六张辅助表（contracts §14 R9，缺表则对应维度静默空召回）"
        semantic_embedding_format: "TEXT 列 Base64 大端 float32×512（2048B，NO_WRAP）——双端必须同格式，加往返单测钉住（contracts §14 R6）"
      permission: "无新权限（本地 DB + 已有相册访问）"
      privacy: "搜索 100% 端侧（SQL + 端侧 MobileCLIP）；Chat 入口的 query 文本经远程 LLM 解析意图属既有合规路径（文本/元数据可远程，ADR-008），图片不出端"
      known_android_bugs: "裸「冬天」跨年 startMs>endMs 恒空、removeTimeWords 正则 \\\\d 转义失效（contracts §14 R4/R5）——iOS 按正确语义实现，Android 不修（铁律 1），见 allowed_differences.search_engine_edge_cases"

    allowed_ios_differences:
      - "video 项禁用 image_understanding/ocr（iOS 无视频帧抽取管线；Android vision 静默 no-op，iOS 直接 disabled 更清晰）"
      - "image_understanding caption 暂为英文（Android Florence-2 路径同样先出英文再翻译；iOS 翻译留后续）"

# ============================================================================
# 第三部分：分组模式（Grouping Modes）
# ============================================================================
# 🔴 gap #9 / P1-5：iOS 仅 DATE 一种，必须实现全部 6 种。
# 通过顶栏 Sort 菜单切换，改变网格的分组与分组头显示。

grouping_modes:

  DATE:
    label: "按日期分组"
    header_source: date_label               # "今天"/"昨天"/"2026年8月"
    header_format: localized_date_string
    sort: descending                        # 最新在前
    is_default: true

  FACE:
    label: "按人脸分组"
    header_source: face_cluster_id          # 人脸聚类 ID / 代表标签
    behavior: 按人脸检测结果聚类，相同人脸的照片归为一组

  PERSON:
    label: "按人物分组"
    header_source: person_name              # 已命名确认的人物
    behavior: 已确认身份的人物分组（区别于 FACE 的自动聚类）

  LANDSCAPE:
    label: "按风景分组"
    header_source: fixed_label              # 固定标题「风景」（R.string.landscape）
    behavior: |
      筛选进唯一组（非按标签分组）：labels JSON {scene,activity,objects[],tags[]}
      全标签命中风景关键词集合（LANDSCAPE_SCENES，controlled_vocab 自然/城市/户外场景词）
      → 全部进单一「风景」组；无命中 → 空列表。
      （2026-08-16 spec 漂移修正：原「按 VLM 场景识别结果分组」与代码不符，
      以 GetGroupedMediaUseCase.kt 定稿为准）

  LOCATION:
    label: "按位置分组"
    header_source: city                     # 城市名（GPS 反编码，media_assets.city）
    behavior: 按 city 分组（组数=城市数）+ 无 city 兜底组「无位置」（NO_LOCATION）

  NONE:
    label: "不分组"
    no_header: true
    flat_grid: true                         # 纯网格，无分组头，无 Section

# ============================================================================
# 第四部分：状态枚举（State Machine）
# ============================================================================

states:

  idle:
    description: "默认状态：网格 + 分组头 + 顶栏 + 底栏"
    top_bar: AppTopBar
    bottom: FloatingBottomTab
    grid: visible
    scan_progress: hidden
    media_pager: closed

  scrolling:
    description: "网格滚动中"
    behavior: |
      分组头随滚动（sticky 吸附）。
      顶栏和底栏保持可见（不自动隐藏）。

  search_active:
    description: "搜索模式激活"
    top_bar: SearchTopBar                   # 顶栏切换为搜索框
    grid: search_results                    # 网格显示搜索结果替代全量
    back: clear_search                      # Back → 退出搜索
    sub_states:
      - search_has_results
      - search_no_result                    # → 显示"未找到匹配…"提示

  selection_mode:
    description: "多选模式（长按触发）"
    trigger: long_press_thumbnail
    overlay: black_alpha_30_on_selected     # 选中项遮罩
    checkbox: visible_on_all_items          # 所有项显示 checkbox
    bottom: selection_bottom_bar            # 底栏替换为选择操作栏
    drag: drag_multi_select                 # 拖拽连续选择
    back: exit_selection_mode               # Back → 退出选择

  scanning:
    description: "TAG 扫描进行中"
    scan_progress: visible                  # 顶栏下显示进度条
    behavior: 进度条显示扫描进度，扫描完成后自动隐藏

  permission_denied:
    description: "权限拒绝 / 未授权"
    grid: hidden
    show: GalleryPermissionMessage          # 显示授权引导页

  loading:
    description: "冷启动数据加载中"
    grid: hidden
    show: GallerySplashPlaceholder          # 显示名言占位页

  media_pager_open:
    description: "大图页已打开，覆盖在网格之上"
    media_pager: visible                    # scale 转场展开
    grid: behind_pager                      # 网格在底层不可见
    back: close_media_pager                 # Back → scale 关闭大图页

# ============================================================================
# 第五部分：允许的平台差异
# ============================================================================

allowed_differences:

  - dimension: permission_flow
    android: "Photo Picker 范式"
    ios: "Limited Access / Full Access / Add-Only 多态"
    rule: "状态语义对齐（有权限/无权限），UI 形态各端原生"

  - dimension: font_family
    android: "Roboto"
    ios: "SF Pro"
    rule: "字号/字重对齐，字体族各自原生"

  - dimension: icon_system
    android: "Material Icons"
    ios: "SF Symbols"
    rule: "语义一致即可，本 spec 每个 icon 已给出 SF Symbol 建议"

  - dimension: back_gesture
    android: "系统 Back 键"
    ios: "左缘右划"
    rule: "按 back_stack 优先级链语义映射"

  - dimension: scroll_sticky_header
    android: "LazyVerticalGrid sticky item"
    ios: "LazyVGrid pinnedViews: .sectionHeaders"
    rule: "分组头吸附效果一致即可"

  - dimension: video_player_engine
    android: "ExoPlayer + PlayerView"
    ios: "AVPlayer + AVPlayerViewController"
    rule: "控制条风格各端原生，播放功能必须存在"

  - dimension: limited_access_banner
    android: "无（Photo Picker 范式无 limited 概念）"
    ios: "Limited Access banner + '管理可访问的照片' 按钮"
    rule: "iOS 独有合理差异，gap analysis ✅"

  - dimension: search_engine_edge_cases
    android: "现网两个边界 bug：裸「冬天」时间范围 startMs>endMs 恒空；「近N个月」removeTimeWords 正则转义失效致清洗残留"
    ios: "按正确语义实现（冬天=跨年范围、近N个月正常解析）"
    rule: "bug 不对齐：iOS 做对的事，Android 修复登记技术债（铁律 1 不动已验证代码），详见 contracts.md §14 R4/R5"

  - dimension: search_engine_hosting
    android: "搜索引擎在 androidApp 模块（Kotlin + Room）"
    ios: "Swift 对等实现 + TagDatabase SQLite"
    rule: "行为契约对齐（contracts.md），实现语言/ORM 各自原生；远期可评估纯逻辑上 shared commonMain（技术债）"

# ============================================================================
# 第六部分：禁止事项（iOS 实现红线）
# ============================================================================
# 以下行为是 gap analysis 的根因——iOS AI 回退到系统默认控件导致不对齐。

prohibited:

  - id: no_navigation_stack
    rule: "禁止使用 NavigationStack / NavigationLink 实现相册顶栏和大图页导航"
    reason: "顶栏必须自建 48dp AppTopBar；大图页必须 scale 转场"

  - id: no_system_tabview
    rule: "禁止使用系统 TabView 作为底部导航"
    reason: "必须自建 FloatingBottomTab 悬浮胶囊"

  - id: no_system_list
    rule: "禁止使用系统 List 作为网格或分组容器"
    reason: "必须用 LazyVGrid + Adaptive 列"

  - id: no_fixed_column_count
    rule: "禁止固定 3 列（或任何固定列数）"
    reason: "必须 Adaptive(minimum: 110dp) 自适应"

  - id: no_default_center_crop_for_faces
    rule: "禁止对人像缩略图使用默认居中裁切"
    reason: "必须 faceAwareVerticalAlignment(faceFocusY)，否则砍头杀"

  - id: no_page_dots
    rule: "禁止在大图页显示分页指示器（page dots）"
    reason: "Android 无此指示器，gap #30 标记为多余"

  - id: no_plain_text_group_header
    rule: "禁止用纯文本无颜色区分的分组头"
    reason: "必须 titleMedium+bold+primary 标题 + bodyMedium+secondary 计数"
