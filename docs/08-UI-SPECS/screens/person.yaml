# ============================================================================
# 人物屏完整产品规格书（Person Screen Spec）—— 列表 + 详情
# ============================================================================
# 基准端：Android PersonScreen.kt / components/PersonListItem.kt
#        / components/PersonInfoScreen.kt / components/PersonCoverPickerSheet.kt
#        / common/PersonRelationPicker.kt / common/PersonRelationLabels.kt
# 用途：iOS 重做的唯一输入，不读 Android 源码
# 值引用：尺寸引用 design-tokens.json token 名（如 spacing.md=12），数值在注释标注
# 颜色引用：colorScheme.* 节点；图标 Material→SF Symbols
# 数据源：iOS TagDatabase（persons/face_embeddings/media_assets + 新增 person_relations）
#         —— 与 Android 同构的聚类模型，非手动建人

# ============================================================================
# 1. 列表页（PersonScreen）总体结构
# ============================================================================
person_list:
  type: full_screen
  background: "colorScheme.background"          # 浅色场景；iOS 主入口在 MainTabView page3（黑底相册 shell 内）按 shell 语境
  layout: vstack                                # Column：顶栏 + 内容
  entry_points:
    - main_pager_page3                          # MainTabView page 3，注入 onBack→相册页
    - settings_navigation_push                  # Settings NavigationLink push，系统返回
  on_enter: "reconcileAndLoad()"                # 修复孤儿/悬空封面→聚类维护→load（幂等）

# ── 顶栏（AppTopBar）──
  top_bar:
    height: "topBar.height=48"
    title:                                       # 两行标题组（2026-08-22 Ardot 设计稿定稿）
      line1: { text: "people_title(People/人物)", size: 20, weight: SemiBold }
      line2:
        text: "people_stats_format(%1$s · %2$s) = people_people_count(36 people/人) + people_photos_count_full(141 photos/张照片)"
        size: 12
        color: "colorScheme.onSurfaceVariant"
      stats_semantics: "可见人物数 · 可见人物照片总数（sumOf photoCounts/faceCount）"
    nav_back:
      icon: { material: arrow_back, sf: "chevron.left" }
      enabled_when: "isActivePage"              # pager 非当前页时禁用，防跨页 back 捕获
      click: "onNavigateBack → 切相册页"
    actions:                                     # 右侧，顺序
      - id: filter_toggle
        icon:
          show_all_off: { material: filter_list, sf: "line.3.horizontal.decrease" }
          show_all_on:  { material: filter_list_off, sf: "line.3.horizontal.decrease.circle" }
        desc_show_all: "people_filter_show_all"            # 显示全部人物
        desc_hide:     "people_filter_hide_singletons"     # 隐藏未命名单人分组
        click: "toggleShowAll()"
      - id: recluster
        icon: { material: autorenew, sf: "arrow.triangle.2.circlepath" }
        desc: "people_recluster"                            # 重新聚类
        click: "TagScanOrchestrator.runPass2Clustering() + snackbar(people_recluster_started)"
      # rescore（重打分）—— Stage 2 暂缓，Stage 1 不渲染
  snackbar_host: true

  # 隐藏计数提示（showAll=false 且 hidden>0 时）
  hidden_hint_snackbar: "people_filter_hidden_hint"         # 已隐藏 N 个未命名单人分组…

# ============================================================================
# 2. 列表网格 + 过滤 + 排序
# ============================================================================
  grid:
    layout: lazy_vertical_grid
    columns: "person.gridColumns=2"             # 固定 2 列
    content_padding: "spacing.md=12 四边"
    horizontal_spacing: "spacing.md=12"
    vertical_spacing: "spacing.md=12"
    key: "person.personId"

  filtering:
    coverable: "封面 uri 解析非空（filterCoverable）"      # 删缺失封面者
    default_show_all_false:
      hide: "未命名(name 空) 且 photoCount<2 的单人噪声组"
    show_all_true: "全部 coverable 人物"

  sort:                                          # 降序
    - "intimacy: self(5) > 浪漫[PARTNER/SPOUSE](4) > IDOL(3) > 家庭谓词(2) > 其他社会关系(1) > 无关系(0)"
    - "named_first: !name.isBlank() 降序"
    - "named: photoCount 降序；unnamed: updatedAt 降序"
    - "tiebreak: updatedAt 降序"

  empty_state: none                              # 对齐 Android：加载/空时网格直接空，无占位
  loading_state: none                            # 无 spinner

# ============================================================================
# 3. 列表卡片（PersonListItem）
# ============================================================================
list_item:
  type: card
  shape: "person.cardRadius=16"                  # RoundedCornerShape(16dp) 全圆角卡
  container_color: "colorScheme.surfaceContainerLow"
  elevation: "elevation.low=1"
  layout: column
  children:

    # (a) 封面区
    - id: cover
      type: clickable_box
      aspect_ratio: 1                            # 方形 1:1
      clip: "person.cardRadius=16（仅顶两角）"
      content:
        has_cover:
          component: "ThumbnailView / AsyncImage"
          scale: crop
          alignment: "faceAwareVerticalAlignment(faceFocusY)"   # 水平居中，垂直按 faceFocusY
          fallback_alignment: center             # faceFocusY==nil
        no_cover:
          background: "colorScheme.surfaceVariant"
          center_icon: { material: face(48dp), sf: "face.smiling", tint: "colorScheme.onSurfaceVariant" }   # 2026-08-22：人脸图标占位（原纯灰底）
      count_badge:                                # 2026-08-22 定稿：张数角标（原在名字旁，后独立为封面浮层）
        align: bottom_end
        margin: 8
        shape: pill(100)
        bg: "black@60%"
        padding: { h: 8, v: 4 }
        text: "people_photos_count（en 紧凑式 '%1$dP'（plurals one/other 同值）；zh='%1$d 张/張'；iOS 双键 %1$d photo(s) 同值）"
        style: { size: 11, weight: SemiBold, color: white }
      content_description: "person.name 或 people_default_name(人物 #%d)"
      click: "onCoverClick → 相册按人物筛选（Stage2）；Stage1 → 进详情"

    # (b) 信息列
    - id: info_column
      padding: "spacing.md=12"
      children:

        # 行1：名称块（2026-08-22：张数移至封面右下角角标，本行只剩名字）
        - id: row1
          layout: row_center_vertical
          children:
            - id: name_block                     # weight 1
              display:
                named: { text: "person.name", size: 15, weight: SemiBold, color: "colorScheme.onSurface" }
                unnamed: { text: "person_edit_name_hint(Add name/添加名字/加入名字)", size: 15, weight: SemiBold, color: "colorScheme.primary" }   # 主题色引导点击命名
              click: "startEditing(personId)"    # 进入行内改名
              editing_mode:                      # NameEditor
                text_field: { size: 16, weight: SemiBold, single_line: true, ime: Done, autofocus: true }
                save_button: { icon: check(small 28dp/18dp), tint: primary, desc: save }
                cancel_button: { icon: close(small 28dp/18dp), tint: onSurfaceVariant, desc: cancel }

        # 行2（常驻，2026-08-22 定稿）：关系 chip 居左（无关系时显示描边引导胶囊）+ info 按钮固定右端
        - id: row2
          layout: row_center_vertical
          padding_top: 6
          children:
            - id: relation_chip
              visible_when: "isSelf || relation != null"
              shape: "pill=100（2026-08-22 由 radius.small=8 改全圆角胶囊）"
              padding: { h: 10, v: 4 }
              label:
                is_self: "person_is_self(这是我)"
                custom: "relation.customLabel"
                predicate: "personRelationLabelRes(relation.predicate)"
                else: "person_relation_none"
              size: "typography.bodySmall=12"
              max_lines: 1
              color:                                # 2026-08-22 按关系分组着色
                is_self: { bg: "colorScheme.primaryContainer", text: "colorScheme.onPrimaryContainer" }
                custom: { bg: "colorScheme.surfaceContainerHighest", text: "colorScheme.onSurfaceVariant" }
                family: { bg: "colorScheme.secondaryContainer", text: "colorScheme.onSecondaryContainer" }   # predicate.isFamilyRelation()
                social: { bg: "colorScheme.tertiaryContainer", text: "colorScheme.onTertiaryContainer" }
                none:   { bg: "colorScheme.surfaceContainerHighest", text: "colorScheme.onSurfaceVariant" }
              click: "onInfoClick → 进详情"
            - id: add_relation_chip                # 2026-08-22：无关系时的空态填充（原不占位，卡片第二排过空）
              visible_when: "!isSelf && relation == null"
              shape: pill(100)
              style: { border: "1dp colorScheme.outlineVariant", bg: transparent }
              padding: { h: 10, v: 4 }
              content: "add 图标(12dp) + person_relation_add(Add relation/添加关系/新增關係)，12sp colorScheme.onSurfaceVariant"
              click: "onInfoClick → 进详情（引导设置关系）"
            - id: spacer_flex                     # weight 1 / Spacer，撑开右端
            - id: info_button
              type: icon_button(32dp)
              icon: { material: more_vert(20dp), sf: "info.circle" }
              tint: "colorScheme.onSurfaceVariant"
              desc: "person_info_title(编辑人物)"
              click: "onInfoClick → 进详情"

# ============================================================================
# 4. 详情页（PersonInfoScreen）总体结构
# ============================================================================
person_detail:
  type: full_screen_overlay                      # 列表层 infoTarget!=null 时覆盖
  background: "colorScheme.background"
  layout: vstack                                 # 顶栏 + 滚动主体
  local_state: [ currentRelation, customLabel, currentIsSelf, showCoverPicker, nameText ]   # 2026-08-22：移除 isEditingName（姓名常开编辑态）

  top_bar:
    title: "person_info_title(Edit person/编辑人物/編輯人物)"   # 2026-08-22：由簇 ID 改为功能标题
    nav_back: { click: "onNavigateBack(关闭)" }
    actions:
      - id: rescore
        icon: { material: auto_awesome, sf: "sparkles" }
        desc: "people_rescore"
      - id: reset
        icon: { material: restart_alt, sf: "arrow.counterclockwise" }
        desc: "person_relation_none"
      - id: save
        icon: { material: check, sf: "checkmark" }
        desc: save
        click: "doSave()"
      # rescore Stage2；Stage1 iOS 只渲染 reset + save

  body:
    scroll: vertical
    padding: { h: 16 }
    spacing: 20
    sections:

      # ── A. 头部：圆形头像 + 相机角标（2026-08-22 Ardot 设计稿定稿）──
      - id: header
        align: center_horizontal
        padding_top: 16
        children:
          - id: avatar_header
            size: "120 圆形"
            shape: circle
            content:
              has_cover: { component: AsyncImage, scale: crop, alignment: faceAware(faceFocusY) }
              no_cover: { background: surfaceVariant, center_icon: { material: face(48dp), sf: "face.smiling", tint: onSurfaceVariant } }
            click: "showCoverPicker=true"
            badge:
              size: 32                             # 右下相机角标
              align: bottom_end
              shape: circle
              ring: "2dp colorScheme.background 描边"
              bg: "colorScheme.primary"
              icon: { material: photo_camera(16dp), sf: "camera.fill", tint: "colorScheme.onPrimary" }
              # 2026-08-26 起角标不再打开封面选择 Sheet：登记 AvatarCaptureController.begin(Person(personId), PEOPLE_PAGE)
              # 后 navigate(Screen.Camera) 进相机路由拍封面，落库后自动设为该人物封面（dedup 设计规范 §11.2）
              click: "avatar_capture(target=Person(personId), origin=PEOPLE_PAGE) → navigate(Screen.Camera)"

      # ── B. 姓名（常开编辑态，保存时提交）──
      - id: name_field
        children:
          - id: name_label
            text: "person_name_label(姓名).uppercase()"
            style: "11 / SemiBold / letterSpacing 1"
            color: "colorScheme.onSurfaceVariant"
          - id: name_input
            margin_top: 6
            container: { bg: "colorScheme.surfaceContainerLow", shape: "radius.md=12", padding: { start: 14, end: 6, v: 4 } }
            text_field: { size: 16, single_line: true, ime: Done, placeholder: "person_edit_name_hint(Add name)" }
            clear_button: { visible_when: "nameText 非空", icon: close(18dp), tint: onSurfaceVariant, click: "清空 nameText" }

      # ── C. 「这是我」胶囊（居中）──
      - id: is_self_toggle
        align: center_horizontal
        type: filter_chip
        selected: "currentIsSelf"
        label: "person_is_self(这是我)"
        leading_icon: "check(18dp) 仅选中态"
        click: "currentIsSelf = !currentIsSelf"

      # ── D. Relationship 分组卡片 ──
      - id: relation_card
        container: { bg: "colorScheme.surfaceContainer", shape: "person.cardRadius=16", padding: 16, spacing: 10 }
        children:
          - id: relation_title
            text: "person_relation_label(This person is my…)"
            style: "14 / SemiBold"
            color: "colorScheme.onSurface"
          - id: relation_picker                  # 见 §5

      # ── E. Photos 预览条（有照片时）──
      - id: photos_section
        visible_when: "photos 非空"
        spacing: 10
        padding_bottom: 24
        children:
          - id: photos_header
            layout: row_space_between
            title: { text: "person_photos_section(照片)", style: "14 / SemiBold" }
            count: { text: "people_photos_count_full(48 photos/张照片)", size: 12, color: "colorScheme.onSurfaceVariant" }
          - id: thumb_strip
            layout: "row spacing 8"
            items: "photos.take(4)"
            item: { size: 80, shape: "radius.small+=10", scale: crop, click: "showCoverPicker=true" }

# ============================================================================
# 5. 关系选择器（PersonRelationPicker，stateless）
# ============================================================================
relation_picker:
  show_title: false                              # 详情页内嵌，不显示标题（独立用时 true）
  show_none_chip: false                          # 详情页不显示"不设置"chip（reset 按钮替代）
  groups:
    - id: family
      title: "person_relation_group_family(家庭)"
      chips: [ FATHER, MOTHER, SON, DAUGHTER, ELDER_BROTHER, ELDER_SISTER, YOUNGER_BROTHER, YOUNGER_SISTER, GRANDFATHER, GRANDMOTHER, SPOUSE, PARTNER ]
    - id: social
      title: "person_relation_group_social(社会)"
      chips: [ FRIEND, CLASSMATE, COLLEAGUE, IDOL ]
  chip_style:
    type: filter_chip
    height: "chip.height=36"
    selected: { container: "colorScheme.primaryContainer", label: "colorScheme.onPrimaryContainer" }
    unselected: { container: "surfaceVariant@0.5", label: "colorScheme.onSurfaceVariant" }
  selection_rule:
    select_chip: "清空 customLabel + 设 predicate"
    type_custom: "清空所有 chip 选中"
  custom_label:
    type: outlined_text_field
    label: "person_relation_custom_label(自定义称呼)"
    placeholder: "person_relation_custom_hint(如：发小、二儿子)"
    supporting: "person_relation_custom_supporting(填写后以自定义称呼为准)"
    single_line: true
  save_semantics: "customLabel 非空 → effectiveRelation=OTHER；否则所选 predicate"

# ============================================================================
# 6. 封面选择器（PersonCoverPickerSheet）
# ============================================================================
cover_picker:
  trigger: "cover_header click"
  anchor: bottom_sheet                            # iOS: .sheet
  title: "person_select_cover_title(选择封面)"
  style: "titleLarge"
  grid:
    columns: "person.coverPickerColumns=3"
    padding: { h: 16, bottom: 24 }
    item:
      aspect_ratio: 1
      padding: 4
      shape: "radius.small=8"
      scale: crop
  data_source: "getMediaByPersonOrderedForCover(personId)：单人脸优先 + 拍摄时间倒序 + 去重"
  on_select: "updateCover(personId, media.id) → 关闭"

# ============================================================================
# 7. 详情保存逻辑（doSave + applyPersonEdit 单次写入；2026-09-29 静默丢弃修复定稿）
# ============================================================================
save_logic:
  steps:
    - "effectiveRelation = customLabel 非空(trim) ? OTHER : currentRelation"
    - "onSave(nameText.trim(), effectiveRelation, customLabel, currentIsSelf) —— 改名随保存单次提交"
    - "onNavigateBack()（被拒引导提示在父列表页展示，不在编辑页内弹）"
  apply_person_edit:
    signature: "applyPersonEdit(personId, name, relation, customLabel, isSelf) -> DeclareRelationResult?"
    steps:
      - "目标人物行不存在 → 返回 SubjectNotFound（前置检查，全部写操作跳过）"
      - "name 非空 → renamePerson（空 = 保持原名不变；编辑页不支持取消命名，仅列表行内改名支持）"
      - "isSelf=true → setSelf；isSelf=false 且当前 self==该人 → clearSelf"
      - "relation 非空 → declareRelation（覆盖：清旧→写新；无 self 人物时返回 SelfNotDeclared 拒绝写入）→ 透传 Declared / SelfNotDeclared / SubjectNotFound"
      - "relation 空 → 清除该人物全部关系，返回 null/nil"
    invariant: "声明结果必须透传给 UI——吞掉 SelfNotDeclared 即「修改关系不生效」静默 bug（本次修复根因）"
  declare_relation_result: [ Declared, SelfNotDeclared(无「这是我」标记), SubjectNotFound(目标人物已不存在) ]
  error_guidance:
    SELF_NOT_DECLARED: "提示文案 person_relation_need_self（还没有标记「这是我」：请先在自己的分组上打开「这是我」，再设置关系）"
    SUBJECT_NOT_FOUND: "提示文案 person_save_subject_gone（该人物已不存在（可能已被重新聚类合并））"
    ios_surface: "详情页立即关闭；引导经列表页 toast 胶囊展示（PersonViewModel.toast，3s 自动消失），对齐 Android snackbar 于 PersonScreen"
  removed: "独立 onUpdateName 通路（改名并入 onSave 单次写入，消除「旧名快照回写新名」竞态）"

# ============================================================================
# 8. 数据模型（TagDatabase，与 Android 同构）
# ============================================================================
data_model:
  person:
    fields: [ personId(PK auto), name(nullable), cover_media_id(nullable), face_count, is_self(全局唯一), created_at, updated_at ]
  photo_association:
    primary: "face_embeddings.person_id（聚类自动）"
    label_mention: "命名人物 ∪ media_assets.labels/labelsEn/labelsZh LIKE %name%（仅命名）"
  photo_count:
    unnamed: "COUNT(DISTINCT media_id) FROM face_embeddings WHERE person_id"
    named:   "cluster ∪ label-mention 并集 size"
    fallback: "face_count"
  relation:
    table: "person_relations(relationId, subjectPersonId, objectPersonId=自我, predicate, source, customLabel, confidence, UNIQUE(subject,predicate,object))"
    semantics: "该人物 是 我的 (predicate)；object 隐式 = is_self 人物"
    source_default: "RelationSource.renameDialog"
  cover:
    auto: "cover_media_id（reconcile 修复悬空→指向存活 embedding 的 media）"
    focus: "media_assets.faceFocusY 供人脸感知裁切"

# ============================================================================
# 9. 状态枚举
# ============================================================================
states:
  relation_predicate: [ FATHER, MOTHER, SON, DAUGHTER, ELDER_BROTHER, ELDER_SISTER, YOUNGER_BROTHER, YOUNGER_SISTER, GRANDFATHER, GRANDMOTHER, SPOUSE, PARTNER, FRIEND, CLASSMATE, COLLEAGUE, IDOL, OTHER ]   # SSOT=shared RelationPredicate(23)，分组按 isFamily
  list_mode: [ default_show_all_false, show_all_true ]
  name_state: [ named, unnamed, editing ]
  save_error: [ none, self_not_declared, subject_not_found ]   # 详情保存被拒类型化原因（UI 映射本地化引导文案）

# ============================================================================
# 10. 允许的平台差异 / 平台差异台账
# ============================================================================
allowed_differences:
  - { dimension: icon_set, android: "Material Icons", ios: "SF Symbols", note: "语义一致" }
  - { dimension: bottom_sheet_material, android: "ModalBottomSheet", ios: ".sheet", note: "容器材质各原生，圆角值对齐" }
  - { dimension: card_elevation, android: "1dp shadow", ios: "轻微 shadow/opacity 近似", note: "iOS 卡片可用 surfaceContainerLow + 弱投影" }
  - { dimension: save_guidance_surface, android: "snackbar（人物页）/ Toast（相册 overlay）", ios: "列表页 toast 胶囊（3s 自动消失）", note: "语义一致：类型化错误 → 本地化引导，均不阻断返回" }

platform_differences:
  permission: "无新权限（本地 DB + 已有相册访问）"
  capabilities:
    recluster: "Android=前台服务 intentReembedFaces；iOS=TagScanOrchestrator.runPass2Clustering()（同步触发 Pass2）"
    rescore: "Android=aestheticScoreWorker；iOS=无打分器（Stage2 暂缓）"
    gallery_person_filter: "Android=onRequestGallerySearch(personId)；iOS=相册按 faceId 分组（Stage2 桥接 personId↔faceId）"
    person_edit_surface: "Android=人物页 + 相册人物信息 overlay 双编辑入口（2026-09 修复两处均透出结果）；iOS=仅人物详情页单入口（无相册 overlay）→ 本次跟随只落单入口，台账登记"
  privacy_disclosure: "无变更（人物/照片关联 100% 端侧，不触远程）"

# ============================================================================
# 11. iOS 偏离登记（Stage1 已知 interim 差异，Stage2 收敛）
# ============================================================================
ios_interim_deviations:
  - cover_tap: "Stage1 封面点击→进详情（Android→相册筛选）；Stage2 接相册 personId 筛选后收敛"
  - rescore_button: "Stage1 不渲染重打分按钮；Stage2 接 NIMA 打分器后补"
  - entry_shell_bg: "iOS MainTabView page3 为黑底相册 shell；列表卡片用半透明深色材质近似 surfaceContainerLow（暗色场景）"
