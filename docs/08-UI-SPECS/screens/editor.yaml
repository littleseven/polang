# ============================================================================
# 17. AI 一键优化抽卡（Gacha）— 2026-08-16 反向提取自 Android 定稿
# ============================================================================
# 基准端：PhotoEditorViewModel.kt aiOptimize/rerollGacha/previewGachaCandidate/
#         applyGachaCandidate/dismissGacha + components/GachaCandidateBar.kt
# 数值契约 SSOT：docs/03-TECHNICAL-SPECS/AI_OPTIMIZATION.md §11.5（4 候选/512px/护栏/退化守卫/降级链）
# 隐私：抽卡全链路（场景分析→渲染→NIMA 评分→落库）100% 端侧；NIMA 模型经模型中心分发
#       （id=nima-aesthetic-onnx，文件 nima_mobilenet_aesthetic.onnx，iOS Documents/llm_models/…）
gacha:
  # ── 17.1 对比条 UI（GachaCandidateBar，替换整个 bottomBar）──────────────────
  bar:
    visible_when: "gachaRun != null"          # 对比模式：面板+底栏整体隐藏，底栏位置换本条
    container: { bg: surface, corner_radius: 12, padding: 12 }
    hint_row:
      keep_original: { text_key: ai_optimize_keep_hint, style: bodySmall_onSurfaceVariant }
      pick:         { text_key: ai_optimize_pick_hint,  style: bodySmall_onSurfaceVariant }
      rule: "keepOriginal==true → keep_original 文案；否则 pick 文案"
    cards_row:
      layout: row_spaceEvenly                 # 4 卡均分
      card:
        thumb: { size: gachaCardThumbSize /*84*/, corner_radius: gachaCardThumbCornerRadius /*6*/, scale: crop }
        direction_label: { style: labelSmall_onSurfaceVariant, position: 卡下方 }  # base/clarity/warm/… 本地化见 17.3
        selected_border: { visible_when: previewedIndex==index, width: 2, color: primary }
        recommended_badge:
          visible_when: "index == recommendedIndex && recommendedIndex >= 0"
          position: top_start
          text_key: ai_optimize_recommended    # 「推荐」角标
          style: { bg: primary, fg: onPrimary, corner_radius: 4, font: labelSmall }
        rejected_card: { alpha: 0.4, clickable: false }   # 护栏淘汰卡置灰
        click: previewGachaCandidate(index)    # 点卡 → 主预览区切该卡全尺寸渲染（不叠加）
      aspect_ratio: 1:1
    buttons_row:
      align: end
      items:
        - { id: apply,  text_key: ai_optimize_apply,  type: filled, enabled_when: "previewedIndex >= 0 && !selectedCardRejected", click: applyGachaCandidate }
        - { id: reroll, text_key: ai_optimize_reroll, type: text,   enabled_when: "!isProcessing", click: rerollGacha }
        - { id: close,  text_key: ai_optimize_dismiss, type: text,  click: dismissGacha }
      rerolling_feedback: isProcessing → 16dp CircularProgressIndicator 替换按钮行指示
  # ── 17.2 状态机与语义 ─────────────────────────────────────────────────────
  flow:
    aiOptimize:
      guards: "isProcessing || gachaRun != null → 忽略点击"
      steps: "optimizeWithGacha(sourceUri, baseRecipe=current.recipe) → GachaOutcome"
      on_selected: "推荐卡 recipe 进主预览（不入历史栈）；gachaRun = {previewedIndex: best.index}"
      on_keep_original: "预览原图（previewedIndex=-1）；hint 用 keep 前缀文案"
      on_unavailable: "固定预设直接应用并入历史栈（旧行为兜底；NIMA 未下载/初始化失败时走此链）"
      on_error: "error = ai_optimize_failed(消息)（snackbar 展示）"
      on_error_ios_note: "⚠️ iOS 引擎非 throwing（错误经 unavailable 降级链消化），ai_optimize_failed 键当前无触发点（2026-08-16 审查登记；引擎 null 场景走 ai_optimize_not_available）"
      engine_null: "error = ai_optimize_not_available"
    rerollGacha:
      guards: "isProcessing 时忽略"
      steps: "以 gachaRun.baseRecipe 为基准 + exclude=usedFingerprints 重抽 → 覆写 gachaRun（drawIndex+1）"
      on_expired_or_unavailable: "error = ai_optimize_not_available"
    previewGachaCandidate: "index 卡 toEditRecipe 映射 → 主预览渲染（不叠加 baseRecipe 之外的既有编辑——映射自 baseRecipe 起）；previewedIndex=index"
    applyGachaCandidate: "当前 previewedIndex 卡配方入撤销历史栈（可 undo）+ 反馈落库(source=user) + 退出对比模式(gachaRun=null)"
    dismissGacha: "预览回退 baseRecipe + 反馈落库(source=dismiss) + 退出对比模式"
  compare_mode_locks:          # 对比模式下
    - undo/redo 禁用（canUndo/canRedo=false，§2）
    - CROP 旋转变换等面板操作不可达（bottomBar 已被对比条替换）
    - 顶栏 ai_optimize 禁点（防参数叠加）
    - ⚠️ iOS 注（2026-08-16 审查登记）：顶栏 Done 仍可点，保存的是 baseRecipe 而非预览中的候选卡
      （照 §3 字面 isSaving 门控；Android 同场景行为待双端核——已登记技术债不阻塞）
  feedback_log:                # OptimizeFeedbackLogger → optimize_feedback 表（§15 platform_differences）
    events: [auto(每组抽完), user(应用卡), dismiss(关闭)]
    fields: { image_key: "URI SHA-256 前 16 hex", scene, candidates_json: "每卡 index/direction/nimaScore/rejected/rejectReason/beauty(2)/filter(2)/adjustment(6)", selected_index, source, created_at }
    image_key_privacy: "不存原始路径，仅哈希"
  # ── 17.3 引擎语义（数值 SSOT=AI_OPTIMIZATION.md §11.5；此处为产品语义摘要）────
  engine_semantics:
    draw: "场景分析(8 场景枚举) → base preset → 采样 4 候选(首卡=base 锚点，其余 6 方向池内取+±30% 抖动，指纹去重) → 512px 渲染 → 护栏(高光裁剪增量≥5pp / 亮度漂移>15% 淘汰) → NIMA 评分 → 选优"
    keep_original_guard: "best.nima ≤ original.nima + 0.05 → 不推荐（recommendedIndex=-1，KeepOriginal）"
    min_valid_cards: "有效卡（渲染成功且过护栏）<2 → Unavailable → 固定预设兜底"
    direction_labels: { base: 原图基准, clarity: 清晰, vivid: 鲜艳, warm: 暖色, cool: 冷色, brighten: 提亮, crisp: 锐利 }  # 卡下方向名（iOS 本地化）
    beauty_dims: "SELFIE/PORTRAIT/GROUP 场景候选额外抖动 smoothing±10/whitening±8；iOS 因 B1 不渲染——视觉差异仅剩调色维度（capabilities 台账 gacha 注）"
  # ── 17.4 iOS 实现锚点 ─────────────────────────────────────────────────────
  ios_impl:
    engine_files: "Features/Editor/Gacha/：GachaModels / CandidateSampler / Guardrails / NimaScorer(ORT+模型中心) / CandidateRenderer(CGImageSource 512px+RecipeApplier) / OptimizeGachaEngine / OptimizeRecipeMapper / AiOptimizeService(场景分析+presets+usecase)"
    presets_source: "assets presets/optimize_presets.json 打包进 iOS bundle（与 Android 同源）"
    nima_input: "NHWC 1×224×224×3 逐像素 RGB 交错；归一化 (x-127.5)/127.5；输出 10-bin softmax 期望分 Σpᵢ·(i+1) ∈[1,10]"
    db: "TagDatabase 加 optimize_feedback 表（sqlite3 C API，CREATE TABLE IF NOT EXISTS 幂等）"

