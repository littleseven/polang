# Robolectric 全局默认（isIncludeAndroidResources=true 后真实 manifest 生效）：
# - application：默认用裸 Application，避开 PoLangApplication.onCreate 的 native 库加载
#   （JVM 无 agent_native），与开资源合并前的历史行为一致；需要真实资源的测试类
#   自行用 @Config(application = ...) 覆盖。
# - sdk：真实 manifest targetSdk=36 超出 Robolectric 4.14.1 支持上限，钉 34（项目既有惯例）。
sdk=34
application=android.app.Application
