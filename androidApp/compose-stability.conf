// ADR-016 M4（spec §8）：Compose 稳定性白名单。
// shared 模块（commonMain）不依赖 compose-runtime，领域模型无法加 @Immutable；
// 跨模块引用时在此显式声明 stable，使 LazyColumn item 级 skip 与流式重组性能收口生效。
//
// 🔴 维护约定（M4 review 🟡1 收口）：本文件是**显式清单**——新增条目必须逐个核对
// 目标类真不可变（全 val、无 var/可变集合成员、无内部可变状态）才可列入；
// 类级 `**` 仅用于 sealed/data class 的嵌套子类型（其不可变契约由宿主类的
// val-only 约定覆盖，如 MessagePart 9 子类）。
// ❌ 禁止包级递归通配（`domain.chat.**` 曾把 streaming 包的可变类
// ChatStreamTurnAdapter/TurnPartsReducer/StreamingPacingController——含 var +
// mutableMap 内部状态——一并声明 stable，是静默 stale-UI 埋雷，已收窄）。
// streaming 包的可变类刻意排除；TurnStreamEvent/ChatStreamEvent 为不可变事件，列入。

