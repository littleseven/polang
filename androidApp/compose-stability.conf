// ADR-016 M4（spec §8）：Compose 稳定性白名单。
// shared 模块（commonMain）不依赖 compose-runtime，领域模型无法加 @Immutable；
// 以下类型均为 val-only 不可变数据类/枚举，跨模块引用时显式声明 stable，
// 使 LazyColumn item 级 skip 与流式重组性能收口生效。
// 约定：domain.chat 包新增模型必须保持 val-only（EngineerTaskState/TaskCard 等已核实）。

