name: AI Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # 阿里云镜像对部分产物（Koog iOS metadata 等）间歇 404 且不穿透 mavenCentral，
  # 解析失败会被 Gradle #36284 的 NPE 掩盖真实错误；JITPACK=true 走 google/mavenCentral/jitpack
  JITPACK: "true"

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 gradle/gradle-daemon-jvm.properties 的 toolchainVersion=21 对齐，免去 foojay 自动下载
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ktlint Check
        run: ./gradlew ktlintCheck --quiet

      - name: Detekt Analysis
        run: ./gradlew detekt

      - name: JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Debug Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Detekt Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: androidApp/build/reports/detekt/

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            androidApp/build/reports/tests/
            engines/beauty-engine/build/reports/tests/

  ios-build:
    name: iOS Build + Test (CocoaPods + XcodeGen + xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 全新 checkout 上 Xcode 会在构建图校验阶段因 SharedKit.xcframework 不存在直接失败
      # （本地靠存量产物掩盖），必须先显式构建 XCFramework；构建后 Xcode 脚本阶段按 hash 跳过
      - name: Build SharedKit XCFramework (debug)
        run: ./gradlew :shared:assembleSharedKitDebugXCFramework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Pod install
        run: cd iosApp && pod install --repo-update

      # 设备目标编译验证（不签名）：MNN.framework 仅 device-arm64 slice，
      # 模拟器目标无法链接（无 simulator slice），故 Build 走 generic iOS 设备目标。
      # Swift 单测（PoLangTests 48 文件）需模拟器运行，待 MNN XCFramework 化
      # （补 simulator slice）后恢复 Test 步骤——技术债登记 docs/reviews/2026-11-07-architecture-health-review.md
      - name: Build (Device, unsigned)
        run: |
          xcodebuild -workspace iosApp/PoLang.xcworkspace -scheme PoLang \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

  doc-sync:
    name: Doc Consistency (links / deleted-refs / status markers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check_doc_sync.py
        # 结构层一致性门：断裂内部链接 / 对已删除文件的引用 / 状态标记不一致。
        # 语义层漂移（iOS 状态 vs 代码）脚本不可捕获，靠周期 audit。
        run: python3 scripts/check_doc_sync.py
