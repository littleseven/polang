name: AI Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ktlint Check
        run: ./gradlew ktlintCheck --quiet

      - name: Detekt Analysis
        run: ./gradlew detekt

      - name: JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Debug Build
        run: ./gradlew assembleDebug

      - name: Upload Detekt Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: androidApp/build/reports/detekt/

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            androidApp/build/reports/tests/
            engines/beauty-engine/build/reports/tests/

  ios-build:
    name: iOS Build + Test (CocoaPods + XcodeGen + xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Pod install
        run: cd iosApp && pod install --repo-update

      - name: Build (Simulator)
        run: |
          xcodebuild -workspace iosApp/PoLang.xcworkspace -scheme PoLang \
            -destination 'generic/platform=iOS Simulator' build

      - name: Test (Simulator)
        run: |
          xcodebuild -workspace iosApp/PoLang.xcworkspace -scheme PoLang \
            -destination 'platform=iOS Simulator,name=iPhone 16' test

  doc-sync:
    name: Doc Consistency (links / deleted-refs / status markers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check_doc_sync.py
        # 结构层一致性门：断裂内部链接 / 对已删除文件的引用 / 状态标记不一致。
        # 语义层漂移（iOS 状态 vs 代码）脚本不可捕获，靠周期 audit。
        run: python3 scripts/check_doc_sync.py
