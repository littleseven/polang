# api.polang.net — 反代 Ktor 后端（picme 相关段落的仓库 SSOT）
#
# 与线上的关系：线上 /etc/nginx/sites-enabled/api.polang.net 是单一 server block，
# 除本文件的 location / 外还承载其它租户段落（/muse/ OpenMuse 反向隧道、/tunnel chisel、
# 以及临时实验段落），那些段落由各自租户维护、不在本仓库管理。本文件只钉死
# picme-api 反代部分的契约；改 picme 相关配置先改本文件再同步线上，
# `sudo nginx -t && sudo systemctl reload nginx` 生效。
#
# proxy_read_timeout = 300s（线上 2026-10-10 前已配，2026-10-17 核定入册）：
# 必须 > 云端 Agent 工具桥端侧挂起窗 120s（DeviceToolService.DEFAULT_TIMEOUT_MS），
# 否则工具桥静默期被 nginx 掐断、SSE 轮次异常终结；同时覆盖 /v1/chat/completions
# 长 SSE 生成的慢 chunk 间隔。/v1/browser/ws 有 ping/pong 保活（M2.7），不受读超时影响。
# 不变式：proxy_read_timeout(300s) > 工具桥挂起窗(120s)。改任一侧须保此层叠。
server {
    listen 443 ssl;
    server_name api.polang.net;
    ssl_certificate /etc/letsencrypt/live/api.polang.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.polang.net/privkey.pem;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 透传（browser-vnc M2 帧流代理 /v1/browser/ws；
        # 缺这两行 WS upgrade 在 nginx 层被剥成普通 GET，Ktor 回 400）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE 流式透传
        proxy_buffering off;
        # 长静默连接容忍（> 工具桥 120s 挂起窗；见文件头注释）
        proxy_read_timeout 300s;
    }
}
