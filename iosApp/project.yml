name: PoLang
options:
  bundleIdPrefix: com.mamba.picme
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  knownRegions: ["Base", "en", "zh-Hans", "zh-Hant", "es", "fr"]
  createIntermediateGroups: true

packages:
  # Chat 正文 GFM 渲染（chat.yaml §5 agent_markdown：AST→原生组件，iOS 侧「等价 swift 库，库自选」）
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

targets:
  PoLang:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PoLang
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/SharedKit.xcframework
        embed: true
      # MNN 人脸检测（端侧推理）：静态 framework，仅 link 不 embed
      - framework: Frameworks/MNN.framework
        embed: false
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - package: MarkdownUI
        product: MarkdownUI
    preBuildScripts:
      - name: Build SharedKit
        script: "\"$SRCROOT/scripts/build-shared-kit.sh\"\n"
        basedOnDependencyAnalysis: false
    settings:
      base:
        DEVELOPMENT_TEAM: 6NPE45262A
        PRODUCT_BUNDLE_IDENTIFIER: com.mamba.picme
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "PoLang needs camera access for real-time beauty preview and photo capture."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PoLang needs photo library access to browse and save photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "PoLang needs permission to save beauty-enhanced photos to your library."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        METAL_LANGUAGE_VERSION: "2.4"
        # ⚠️ 必须带 $(inherited)：CocoaPods xcconfig（baseConfigurationReference）注入了
        # MediaPipe 搜索路径/链接标志（含 -ObjC）。target 级裸值会整体覆盖、丢掉 Pod 链接 →
        # “no such module MediaPipeTasksVision”。MNN.framework 在 Frameworks/，需追加该路径解析 <MNN/*.hpp>。
        OTHER_LDFLAGS: ["-ObjC", "$(inherited)"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/Frameworks", "$(inherited)"]
        # Swift ↔ ObjC++ 桥接（暴露 PLMnnFaceDetector 给 Swift）
        SWIFT_OBJC_BRIDGING_HEADER: "PoLang/PoLang-Bridging-Header.h"
        # ORT C API 头文件使用 noexcept in typedefs，需要 C++17（默认 gnu++14 会报错）
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"

  PoLangTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PoLangTests
    dependencies:
      - target: PoLang
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        DEVELOPMENT_TEAM: 6NPE45262A
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PoLang.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PoLang"
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/Frameworks", "$(inherited)"]
        OTHER_LDFLAGS: ["-ObjC", "$(inherited)"]

  PoLangUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PoLangUITests
    dependencies:
      - target: PoLang
    settings:
      base:
        DEVELOPMENT_TEAM: 6NPE45262A
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PoLang

schemes:
  PoLang:
    build:
      targets:
        PoLang: all
        PoLangTests: [test]
        PoLangUITests: [test]
    test:
      targets:
        - PoLangTests
        - PoLangUITests
  # 单测专用 scheme：不构建 PoLangUITests（UI 测试 runner 需现场派生 *.xctrunner
  # provisioning profile，CLI 无 Apple ID 会话时会阻塞；单测 bundle 无此需求）。
  # 供 CI / ios-auto-dev-loop Phase 1 在签名受限环境跑 PoLangTests。
  PoLangUnitTests:
    build:
      targets:
        PoLang: all
        PoLangTests: [test]
    test:
      targets:
        - PoLangTests
