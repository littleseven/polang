# xuxingzhiyuan.cn 备案期预览站：非标端口 8100，IP 直连预览（内容与已公开的 polang.net 一致，无需认证）。
# 备案通过后按 specs/2026-09-16-xuxingzhiyuan-cn-mirror-design.md §6 切换 80/443 并移除本配置。
server {
    listen 8100;
    listen [::]:8100;
    server_name xuxingzhiyuan.cn www.xuxingzhiyuan.cn _;

    root /var/www/xuxingzhiyuan/docs-site;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
